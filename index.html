/* ---------- 歌词 ---------- */
function buildTimeline(song){
  const lines = song.lyrics;
  const start = song.dur * .085;
  const end = song.dur * .9;
  const gap = lines.length > 1 ? (end - start) / (lines.length - 1) : 0;
  const tl = [{ t:0, inter:true }];
  lines.forEach((tx, i) => tl.push({ t:start + gap * i, text:tx }));
  tl.push({ t:end + gap * .95, inter:true });
  return tl;
}

function lyricHTML(tl){
  return tl.map(l =>
    l.inter
      ? '<div class="lrc-line"><span class="lrc-interlude"><i></i><i></i><i></i></span></div>'
      : '<div class="lrc-line">' + escapeHtml(l.text) + '</div>'
  ).join('');
}

function layoutLyricPad(){
  [['lyricTrack', 'lyricZone'], ['mLyricTrack', 'mLyricZone']].forEach(pair => {
    const track = $(pair[0]), zone = $(pair[1]);
    if(!track || !zone) return;
    const p = Math.max(58, Math.round(zone.clientHeight / 2 - 24)) + 'px';
    track.style.paddingTop = p;
    track.style.paddingBottom = p;
  });
}

function renderLyrics(){
  const tl = buildTimeline(SONGS[App.idx]);
  App.lyrics = tl;
  const a = $('lyricTrack'), b = $('mLyricTrack');
  a.innerHTML = lyricHTML(tl);
  b.innerHTML = lyricHTML(tl);
  App.lyricIdx = -2; App.lyricIdxM = -2;
  layoutLyricPad();
  a.style.transform = 'translateY(0)';
  b.style.transform = 'translateY(0)';
}

function updateLyric(pos){
  const tl = App.lyrics;
  if(!tl.length) return;
  let i = 0;
  for(let k = 0; k < tl.length; k++){ if(pos >= tl[k].t) i = k; else break; }

  [[$('lyricTrack'), $('lyricZone'), 'lyricIdx'],
   [$('mLyricTrack'), $('mLyricZone'), 'lyricIdxM']].forEach(pair => {
    const track = pair[0], zone = pair[1], key = pair[2];
    if(!track || !track.children.length) return;
    if(i === App[key]) return;
    const prev = track.querySelector('.lrc-line.cur');
    if(prev) prev.classList.remove('cur');
    const node = track.children[i];
    if(!node) return;
    node.classList.add('cur');
    for(let k = 0; k < track.children.length; k++){
      const el = track.children[k];
      el.classList.toggle('near', Math.abs(k - i) === 1);
      el.classList.toggle('past', k < i - 1);
    }
    /* 仅在成功定位后记录，避免容器尚未布局时错过居中 */
    if(centerLyric(track, zone, node)) App[key] = i;
  });
}

function centerLyric(track, zone, node){
  if(!zone || !zone.clientHeight) return false;
  const y = node.offsetTop + node.offsetHeight / 2;
  track.style.transform = 'translateY(' + (zone.clientHeight / 2 - y) + 'px)';
  return true;
}

function recenterLyrics(){
  layoutLyricPad();
  const track = $('lyricTrack');
  if(track && App.lyricIdx > -2 && track.children[App.lyricIdx]) centerLyric(track, $('lyricZone'), track.children[App.lyricIdx]);
  const mt = $('mLyricTrack');
  if(mt && App.lyricIdxM > -2 && mt.children[App.lyricIdxM]) centerLyric(mt, $('mLyricZone'), mt.children[App.lyricIdxM]);
}

function syncVolUI(){
  const v = App.muted ? 0 : App.vol;
  const pct = (v * 100).toFixed(0) + '%';
  $('volFill').style.width = pct;
  $('volKnob').style.left = pct;
  $('volSlider').setAttribute('aria-valuenow', Math.round(v * 100));
  $('btnMute').classList.toggle('active', App.muted || App.vol === 0);
  $('volWave').style.opacity = v > .05 ? 1 : 0;
  $('volWave2').style.opacity = v > .5 ? 1 : 0;

  /* 移动端独立音量 */
  const mv = App.muted ? 0 : App.volM;
  const mpct = (mv * 100).toFixed(0) + '%';

/* ============================================================
   5.1 播放队列
   ============================================================ */
const QP_ICONS = {
  grip:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6.4" r="1.75"/><circle cx="15" cy="6.4" r="1.75"/><circle cx="9" cy="12" r="1.75"/><circle cx="15" cy="12" r="1.75"/><circle cx="9" cy="17.6" r="1.75"/><circle cx="15" cy="17.6" r="1.75"/></svg>',
  rm:'<svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>',
  add:'<svg viewBox="0 0 24 24" fill="none"><path d="M12 5.5v13M5.5 12h13" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>'
};

const queueHas = (i) => App.queue.indexOf(i) > -1;

/* 无障碍播报：同一句连续触发也要能听到 */
function announce(msg){
  const el = $('liveRegion');
  if(!el) return;
  el.textContent = '';
  setTimeout(() => { el.textContent = msg; }, 40);
}

function addQueue(i){
  if(queueHas(i)){ toast('这首歌已经在队列里了'); return; }
  App.queue.push(i);
  save(); renderQueue();
  toast('已加入队列 · ' + SONGS[i].title);
  announce('已加入队列：' + SONGS[i].title + '，当前第 ' + App.queue.length + ' 位');
}
function removeQueue(pos){
  if(pos < 0 || pos >= App.queue.length) return;
  const title = SONGS[App.queue[pos]].title;
  App.queue.splice(pos, 1);
  save(); renderQueue();
  toast('已移出队列 · ' + title);
  announce('已移出队列：' + title);
}
/* 把 from 位置搬到 to 位置。重排后 DOM 会重建，所以要把焦点还给抓手，
   否则键盘用户一按方向键就掉焦点。 */
function reorderQueue(from, to, focusPos){
  const n = App.queue.length;
  if(from < 0 || from >= n) return false;
  to = clamp(to, 0, n - 1);
  if(to === from) return false;
  const arr = App.queue.slice();
  const moved = arr.splice(from, 1)[0];
  arr.splice(to, 0, moved);
  App.queue = arr;
  save(); renderQueue();
  const at = focusPos != null ? focusPos : to;
  const g = document.querySelector('.qp-grip[data-grip="' + at + '"]');
  if(g) g.focus();
  announce(SONGS[moved].title + ' 移到第 ' + (to + 1) + ' 位');
  return true;
}
function clearQueue(){
  if(!App.queue.length){ toast('队列已经是空的'); return; }
  const n = App.queue.length;
  App.queue = [];
  save(); renderQueue();
  toast('已清空队列 · ' + n + ' 首');
}
function shiftQueue(){
  if(!App.queue.length) return null;
  const i = App.queue.shift();
  save(); renderQueue();
  return i;
}

/* 顺序播放的后续预览（不含当前曲） */
function upcomingPreview(max){
  const arr = filtered();
  const pool = arr.length ? arr : SONGS.map((s, k) => k);
  if(pool.length < 2) return [];
  const pos = pool.indexOf(App.idx);
  const limit = Math.min(max, pool.length - 1);
  const out = [];
  for(let k = 1; k <= limit; k++){
    out.push(pool[pos > -1 ? (pos + k) % pool.length : (App.idx + k) % pool.length]);
  }
  return out;
}

function qpItemHTML(i, o){
  o = o || {};
  const s = SONGS[i];
  const now = !!o.now;
  const cls = 'qp-item' + (now ? ' now' : '') + (o.preview ? ' preview' : '');

  const lead = now
    ? '<div class="qp-num"><span class="qp-eq' + (Engine.playing ? '' : ' paused') + '" aria-hidden="true"><i></i><i></i><i></i></span></div>'
    : '<div class="qp-num">' + (o.num != null ? o.num : '') + '</div>';

  let tail;
  if(o.actions === 'queue'){
    tail = '<div class="qp-acts">' +
      (o.badge ? '<span class="qp-tag">' + o.badge + '</span>' : '') +
      '<button class="qp-grip" data-grip="' + o.pos + '" title="拖动排序 · 方向键微调" ' +
        'aria-label="调整顺序，当前第 ' + (o.pos + 1) + ' 位，共 ' + (o.total || App.queue.length) + ' 位">' +
        QP_ICONS.grip + '</button>' +
      '<button class="qp-act" data-q="rm" data-pos="' + o.pos + '" aria-label="移出队列" title="移出队列">' + QP_ICONS.rm + '</button>' +
    '</div>';
  }else if(o.actions === 'add'){
    tail = '<div class="qp-acts"><button class="qp-act" data-q="add" data-idx="' + i + '" aria-label="加入播放队列" title="加入播放队列">' + QP_ICONS.add + '</button></div>';
  }else{
    tail = '<div class="qp-acts">' + (o.badge ? '<span class="qp-tag">' + o.badge + '</span>' : '') + '</div>';
  }

  const inner =
    lead +
    '<div class="qp-cover" style="--c1:' + s.c1 + ';--c2:' + s.c2 + '">' + artHolder(i) +
      '<span class="qp-glyph">' + s.glyph + '</span></div>' +
    '<div class="qp-main">' +
      '<div class="qp-name">' + escapeHtml(s.title) + '</div>' +
      '<div class="qp-meta">' + escapeHtml(s.artist) + ' · ' + escapeHtml(s.album) + '</div>' +
    '</div>' + tail;

  if(now) return '<div class="' + cls + '" role="listitem">' + inner + '</div>';
  const posAttr = o.actions === 'queue' ? ' data-pos="' + o.pos + '"' : '';
  const label = o.actions === 'queue'
    ? '第 ' + (o.pos + 1) + ' 位，播放 ' + s.title + ' - ' + s.artist
    : '播放 ' + s.title + ' - ' + s.artist;
  return '<div class="' + cls + '" role="button" tabindex="0" data-play="' + i + '"' + posAttr + ' ' +
    'aria-label="' + escapeHtml(label) + '">' + inner + '</div>';
}

function renderQueue(){
  const body = $('qpBody');
  if(!body) return;
  const q = App.queue;

  let html = '<div class="qp-sec">正在播放</div>';
  html += qpItemHTML(App.idx, { now:true, badge:queueHas(App.idx) ? '队列中' : '' });

  html += '<div class="qp-sec">接下来播放 <span>' +
    (q.length ? q.length + ' 首已排队' : '队列为空 · 按歌单顺序') + '</span></div>';
  if(App.shuffle && !q.length) html += '<div class="qp-hint">随机播放已开启，实际播放顺序不按下面来。</div>';

  q.forEach((i, pos) => {
    html += qpItemHTML(i, { actions:'queue', pos:pos, num:pos + 1, badge:'队列', total:q.length });
  });

  const rest = upcomingPreview(12)
    .filter(i => !queueHas(i))
    .filter((i, k, a) => a.indexOf(i) === k);
  rest.forEach((i, k) => {
    html += qpItemHTML(i, { actions:'add', num:q.length + k + 1, preview:true });
  });

  if(!rest.length && !q.length){
    html += '<div class="qp-hint">歌单里只有这一首，再收藏几首吧。</div>';
  }

  body.innerHTML = html;
  $('qpCount').textContent = q.length;
  syncQueueUI();
}

/* toast 要坐在「所有底部 chrome」之上 —— 比导出卡多考虑一层：导出卡自己。
   它会停留 9 秒，这期间用户完全可能触发一条提示；两者若锚在同一个 bottom 值上
   就会直接叠住。取「卡之上」与「栏之上」的较大者，谁高就站谁上面。 */
function toastBottomOffset(){
  if(!(window.matchMedia && matchMedia('(max-width:900px)').matches)) return null;
  const base = bottomChromeClearance();
  const card = $('expCard');
  if(card && card.classList.contains('show')){
    const r = card.getBoundingClientRect();
    const above = Math.round(window.innerHeight - r.top + 12);
    return base == null ? above : Math.max(base, above);
  }
  return base;
}

/* 浮层收起来时不止要 aria-hidden —— 那只影响无障碍树，不阻止 Tab 落进去。
   CSS 的 visibility 是声明式兜底，inert 再上一道锁：整个子树既不可聚焦、
   也不进入无障碍树，等于把「隐藏」和「不可达」绑成同一件事。
   inert 是属性而非仅 JS：老浏览器不认也无害，CSS 那条已经兜住了。 */
function setInert(el, on){
  if(!el) return;
  if("inert" in el) el.inert = !!on;
  if(on) el.setAttribute("inert", "");
  else el.removeAttribute("inert");
}

function openQueue(){
  if(App.qpOpen) return;

  renderQueue();
  const p = $('queuePanel'), sc = $('qpScrim');

  p.setAttribute('aria-hidden', 'false');
  setInert(p, false);
  requestAnimationFrame(() => sc.classList.add('show'));
  setTimeout(() => { const b = $('qpClose'); if(b && App.qpOpen) b.focus(); }, 340);
}
function closeQueue(){
  if(!App.qpOpen) return;
  App.qpOpen = false;
  const p = $('queuePanel'), sc = $('qpScrim');
  p.classList.remove('open');
  p.setAttribute('aria-hidden', 'true');
  setInert(p, true);

/* 拖动排序：指针事件（鼠标 / 触屏 / 触控笔通用），外加键盘微调 */
function bindQueueDrag(){
  const body = $('qpBody');
  let drag = null;

  const rows = () => $$('.qp-item[data-pos]', body);

  /* 把 from..to 之间的行让位：被拖的行跟指针，其余行平移一格 */
  const shiftRows = (d) => {
    const { from, to, list, pitch } = d;
    list.forEach((n, k) => {
      if(k === from) return;
      let dy = 0;
      if(from < to && k > from && k <= to) dy = -pitch;
      else if(from > to && k >= to && k < from) dy = pitch;
      n.style.transform = dy ? 'translateY(' + dy.toFixed(1) + 'px)' : '';
    });
  };

  const clear = (d) => {
    d.el.classList.remove('dragging');
    d.el.style.transform = '';
    d.list.forEach(n => { n.style.transform = ''; });
    body.classList.remove('dragging');
    try{ d.grip.releasePointerCapture(d.pid); }catch(err){}
  };

  body.addEventListener('pointerdown', e => {
    const grip = e.target.closest('.qp-grip');
    if(!grip) return;
    const item = grip.closest('.qp-item');
    if(!item) return;
    const list = rows();
    if(list.length < 2) return;                 /* 只有一首时不值得拖 */
    e.preventDefault();                          /* 别让浏览器顺手开始选文字 */
    const rects = list.map(n => n.getBoundingClientRect());
    const pitch = (rects[rects.length - 1].top - rects[0].top) / (list.length - 1);
    const from = Number(item.dataset.pos);
    drag = {
      el:item, grip:grip, list:list, rects:rects,
      from:from, to:from, y0:e.clientY,
      pitch:pitch > 4 ? pitch : (rects[0].height || 46),
      pid:e.pointerId, moved:false
    };
    item.classList.add('dragging');
    body.classList.add('dragging');
    try{ grip.setPointerCapture(e.pointerId); }catch(err){}
    if(document.activeElement !== grip) grip.focus();
  });

  body.addEventListener('pointermove', e => {
    if(!drag) return;
    const dy = e.clientY - drag.y0;
    if(!drag.moved && Math.abs(dy) > 3) drag.moved = true;
    drag.el.style.transform = 'translateY(' + dy.toFixed(1) + 'px)';
    /* 拿指针位置和每一行的中线比，算落点 */
    let to = drag.from;
    for(let k = 0; k < drag.rects.length; k++){
      if(k === drag.from) continue;
      const mid = drag.rects[k].top + drag.rects[k].height / 2;
      if(k < drag.from && e.clientY < mid){ to = k; break; }
      if(k > drag.from && e.clientY > mid) to = k;
    }
    if(to !== drag.to){ drag.to = to; shiftRows(drag); }
  });

  const finish = (cancelled) => {
    if(!drag) return;
    const d = drag;
    drag = null;
    clear(d);
    if(cancelled || !d.moved || d.to === d.from) return;   /* 原地松手：弹回原位 */
    reorderQueue(d.from, d.to, d.to);
    toast('队列顺序已更新');
  };
  body.addEventListener('pointerup', () => finish(false));
  body.addEventListener('pointercancel', () => finish(true));

  /* 键盘：方向键微调一格，Home / End 直接顶到两头 */
  body.addEventListener('keydown', e => {
    const grip = e.target.closest('.qp-grip');
    if(!grip) return;
    const pos = Number(grip.dataset.grip);
    const last = App.queue.length - 1;
    let to = null;
    if(e.key === 'ArrowUp') to = pos - 1;
    else if(e.key === 'ArrowDown') to = pos + 1;
    else if(e.key === 'Home') to = 0;
    else if(e.key === 'End') to = last;
    if(to === null) return;
    e.preventDefault();
    e.stopPropagation();                 /* 别让方向键跑去调音量 */
    if(to < 0 || to > last || to === pos) return;
    reorderQueue(pos, to, to);
  });
}

function bindQueuePanel(){
  const body = $('qpBody');

  body.addEventListener('click', e => {
    const act = e.target.closest('.qp-act');
    if(act){
      e.stopPropagation();
      const q = act.dataset.q;
      if(q === 'rm') removeQueue(Number(act.dataset.pos));
      else if(q === 'add') addQueue(Number(act.dataset.idx));
      return;
    }
    /* 抓手只负责排序，不吃播放点击 */
    if(e.target.closest('.qp-grip')){ e.stopPropagation(); return; }
    const item = e.target.closest('.qp-item');
    if(!item || item.dataset.play == null) return;
    const i = Number(item.dataset.play);
    const pos = App.queue.indexOf(i);
    if(pos > -1) App.queue.splice(pos, 1);   /* 出队，避免重复播放 */
    save();
    loadSong(i, true);
    closeQueue();
  });

  body.addEventListener('keydown', e => {
    if(e.key !== 'Enter' && e.key !== ' ') return;
    if(e.target.closest('.qp-act')) return;
    if(e.target.closest('.qp-grip')) return;   /* 抓手走排序逻辑，不触发播放 */
    const item = e.target.closest('.qp-item');
    if(!item || item.dataset.play == null) return;
    e.preventDefault();
    item.click();
  });

  bindQueueDrag();

  $('qpClose').addEventListener('click', closeQueue);
  $('qpClear').addEventListener('click', clearQueue);
  $('qpScrim').addEventListener('click', closeQueue);
  $('btnQueueTop').addEventListener('click', openQueue);
  $('mnpQueue').addEventListener('click', openQueue);
}

function loadSong(i, autoplay){
  const changed = i !== App.idx;
  App.idx = i;

  if(changed) pulseCover();
  Engine.load(i, autoplay);
  syncPlayUI();

}

function togglePlay(){

}

/* 顺序播放的候选池：优先跟随当前可见歌单 */
function playPool(){
  const arr = filtered();
  return arr.length ? arr : SONGS.map((s, k) => k);
}

function pickNext(){
  if(App.queue.length) return App.queue[0];      /* 队列优先 */
  const pool = playPool();
  if(App.shuffle){
    if(pool.length < 2) return pool[0] != null ? pool[0] : App.idx;
    let n = App.idx, guard = 0;
    while(n === App.idx && guard++ < 60) n = pool[Math.floor(Math.random() * pool.length)];
    return n;
  }
  const pos = pool.indexOf(App.idx);
  return pos > -1 ? pool[(pos + 1) % pool.length] : (App.idx + 1) % SONGS.length;
}
function pickPrev(){
  const pool = playPool();
  if(App.shuffle){
    if(pool.length < 2) return pool[0] != null ? pool[0] : App.idx;
    let n = App.idx, guard = 0;
    while(n === App.idx && guard++ < 60) n = pool[Math.floor(Math.random() * pool.length)];
    return n;
  }
  const pos = pool.indexOf(App.idx);
  return pos > -1 ? pool[(pos - 1 + pool.length) % pool.length] : (App.idx - 1 + SONGS.length) % SONGS.length;
}

function nextSong(auto){
  /* 单曲循环只作用于顺序播放；队列里有歌时必须先消化队列 */
  if(auto && App.loop === 'one' && !App.queue.length){
    Engine.seek(0); Engine.start(0); syncPlayUI(); return;
  }
  const queued = shiftQueue();
  loadSong(queued != null ? queued : pickNext(), true);
}
function prevSong(){
  if(Engine.current() > 3){ Engine.seek(0); syncPlayUI(); return; }
  loadSong(pickPrev(), Engine.playing);
}

  $$('.song').forEach(li => {

}

function toggleFav(){

/* 顶部区域下拉收起 */
function bindSheetGesture(){
  const np = $('mobileNp');
  let startY = null, delta = 0, moved = false;

  np.addEventListener('pointerdown', e => {
    if(e.clientY > 170) return;              /* 只从顶部区域起手 */
    if(e.target.closest('button')) return;   /* 按钮不参与拖拽 */
    startY = e.clientY; delta = 0; moved = false;
  });
  np.addEventListener('pointermove', e => {
    if(startY === null) return;
    delta = e.clientY - startY;
    if(delta < 0) delta = 0;
    if(delta > 6){
      if(!moved){ moved = true; np.style.transition = 'none'; }
      np.style.transform = 'translateY(' + delta + 'px)';
    }
  });
  const finish = () => {
    if(startY === null) return;
    startY = null;
    const shouldClose = moved && delta > 92;
    np.style.transition = '';
    np.style.transform = '';
    if(shouldClose) closeMobileNP();
    moved = false; delta = 0;
  };
  np.addEventListener('pointerup', finish);
  np.addEventListener('pointercancel', finish);
}

/* ============================================================
   6.1 离线渲染 & WAV 导出
   引擎所有发声方法都只依赖 this.ctx / this.bus / this.delay / this.noiseBuf，
   所以用 Object.create 造一个换掉宿主的副本，就能把同一套调度逻辑
   搬到 OfflineAudioContext 上全量跑一遍，拿到真实音频。
   ============================================================ */
const EXPORT_SR = 44100;
const EXPORT_TAIL = 2.6;              /* 尾部多留一段，收尾用淡出代替硬切 */
const EXPORT_FADE = .08;              /* 末尾 80ms 淡出：纯防爆音，听不出是淡出 */
const LOOP_RENDER_TAIL = 2.6;         /* 单周期渲染时多渲一段，便于将来取真实衰减尾 */
const EXPORT_GAIN = .995;             /* 削顶保护目标 */

function buildRenderEngine(idx, ctx){
  const R = Object.create(Engine);
  R.ctx = ctx;
  R.idx = idx;
  R.vol = 1;
  R.muted = false;
  R.playing = true;
  R.startCtx = 0;
  R.schedTick = 0;
  R.timer = null;

  R.master = ctx.createGain();
  R.master.gain.value = 1;
  R.comp = ctx.createDynamicsCompressor();
  R.comp.threshold.value = -13;
  R.comp.knee.value = 26;
  R.comp.ratio.value = 6;
  R.comp.attack.value = .004;
  R.comp.release.value = .22;

  R.bus = ctx.createGain();
  R.bus.gain.value = 1;               /* 离线不淡入淡出，总线常开 */

  R.delay = ctx.createDelay(1);
  R.delay.delayTime.value = .27;
  R.fb = ctx.createGain(); R.fb.gain.value = .26;
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 2400; lp.Q.value = .6;
  R.delayWet = ctx.createGain(); R.delayWet.gain.value = .2;
  R.delay.connect(lp); lp.connect(R.fb); R.fb.connect(R.delay);
  R.delay.connect(R.delayWet); R.delayWet.connect(R.bus);

  R.bus.connect(R.comp);
  R.comp.connect(R.master);
  R.master.connect(ctx.destination);

  R.noiseBuf = makeNoiseBuffer(ctx, NOISE_SEED);

  return R;
}

/* 曲子的最小周期：SEG 四段 × 每段 64 个 16 分音符。
   旋律、和弦、鼓全部由 absTick % LOOP_TICKS 决定，所以整首曲子是严格周期的。 */
const loopSeconds = (s) => LOOP_TICKS * (60 / s.bpm) / 4;

/* 把 AudioBuffer 收成纯数据形态，后面的编码/拼接就不用再区分来源了 */
function wrapBuffer(ab){
  const chans = [];
  for(let c = 0; c < ab.numberOfChannels; c++) chans.push(ab.getChannelData(c));
  return { length:ab.length, sampleRate:ab.sampleRate, numberOfChannels:ab.numberOfChannels, chans:chans };
}
const chanOf = (b, c) => b.chans ? b.chans[c] : b.getChannelData(c);

function raceRender(ctx, opt, totalSec){
  const onProg = opt && opt.onProgress;
  if(onProg && totalSec){
    try{
      for(let k = 1; k <= 9; k++){
        ctx.suspend(totalSec * k / 10)
          .then(() => { onProg(k / 10); ctx.resume(); })
          .catch(() => {});
      }
    }catch(e){ /* 进度是加分项，不支持就静默降级 */ }
  }
  /* 兜底：万一 suspend/resume 卡住，别让界面永远转圈。
     opt.timeout 传 0 可关掉（自动化自检里会关，避免虚拟时钟把它提前点燃）。 */
  if(opt && opt.timeout === 0) return ctx.startRendering();
  return Promise.race([
    ctx.startRendering(),
    new Promise((_, rej) => setTimeout(() => rej(new Error('渲染超时，请重试')), (opt && opt.timeout) || 180000))
  ]);
}

/* 逐 tick 排满：适合短片段（自检、试听），不值得为它准备循环 */
async function renderDirect(idx, seconds, tail, sr, opt){
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const td = (60 / SONGS[idx].bpm) / 4;
  const total = seconds + tail;
  const ctx = new OAC(1, Math.ceil(total * sr), sr);
  const R = buildRenderEngine(idx, ctx);
  const ticks = Math.ceil(seconds / td);
  for(let t = 0; t < ticks; t++) R.scheduleTick(t, t * td);
  return wrapBuffer(await raceRender(ctx, opt, total));
}

/* 单周期直渲：从 tick 0 起逐 tick 排满一个完整乐句，再留一段尾。
   渲染量只有全曲的两个十米分之一（186s 的歌只需渲 35.5s），随后纯拷贝铺满。

   这里刻意 *不* 做「渲两段取后一段」的切片：那样同一击打会被排在另一个绝对时刻，
   Chromium 对同一事件的调度落点会差上那么一两个采样；对踩镲这种噪声瞬态，
   一个采样的错位就是 √2 倍 RMS 的差异，实测能到峰值的 20%，而它纯属渲染器伪影。
   从 tick 0 起渲，导出结果与实时播放（同样从 tick 0 起）逐样本一致。
   同一首再次导出直接命中缓存。 */
const loopCache = new Map();

async function renderLoop(idx, sr, opt){
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const s = SONGS[idx];
  const td = (60 / s.bpm) / 4;
  const loopSec = loopSeconds(s);
  const bodyLen = Math.round(loopSec * sr);
  const total = loopSec + LOOP_RENDER_TAIL;
  const key = idx + '@' + sr;

  if(loopCache.has(key)) return loopCache.get(key);

  const ctx = new OAC(1, Math.ceil(total * sr), sr);
  const R = buildRenderEngine(idx, ctx);
  const ticks = Math.ceil(loopSec / td);
  for(let t = 0; t < ticks; t++) R.scheduleTick(t, t * td);

  const src = chanOf(await raceRender(ctx, opt, total), 0);
  const loop = {
    length:Math.min(src.length, Math.round(total * sr)),
    sampleRate:sr, numberOfChannels:1, chans:[src], bodyLen:bodyLen
  };

  if(loopCache.size >= 2) loopCache.delete(loopCache.keys().next().value);
  loopCache.set(key, loop);
  return loop;
}

/* 把循环铺满目标时长，末尾做一次极短淡出。
   铺满用的是同一个周期切片，所以接缝两侧逐样本相同，不存在拼接痕迹。 */
function tileLoop(loop, seconds){
  const sr = loop.sampleRate;
  const src = loop.chans[0];
  const L = loop.bodyLen;
  const n = Math.round(seconds * sr);
  const out = new Float32Array(n);
  for(let i = 0; i < n; i++) out[i] = src[i % L];
  const fade = Math.min(Math.round(EXPORT_FADE * sr), n);
  for(let i = 0; i < fade; i++) out[n - fade + i] *= 1 - i / fade;
  return { length:n, sampleRate:sr, numberOfChannels:1, chans:[out] };
}

/* 渲染一首歌。opt.seconds 只渲染前若干秒（自检用）；opt.mode='direct' 强制逐 tick。 */
async function renderSong(idx, opt){
  opt = opt || {};
  const s = SONGS[idx];
  const sr = opt.sampleRate || EXPORT_SR;
  if(!(window.OfflineAudioContext || window.webkitOfflineAudioContext)){
    throw new Error('当前浏览器不支持离线音频渲染');
  }
  if(opt.seconds || opt.mode === 'direct'){
    return await renderDirect(idx, Math.min(opt.seconds || s.dur, s.dur),
      opt.tail != null ? opt.tail : EXPORT_TAIL, sr, opt);
  }
  return tileLoop(await renderLoop(idx, sr, opt), s.dur + EXPORT_TAIL);
}

function bufferPeak(buffer){
  let peak = 0;
  for(let c = 0; c < buffer.numberOfChannels; c++){
    const d = chanOf(buffer, c);
    for(let i = 0; i < d.length; i++){
      const v = d[i] < 0 ? -d[i] : d[i];
      if(v > peak) peak = v;
    }
  }
  return peak;
}

/* 16-bit PCM WAV 封装 */
function encodeWAV(buffer, gain){
  const ch = buffer.numberOfChannels;
  const len = buffer.length;
  const sr = buffer.sampleRate;
  const dataBytes = len * ch * 2;
  const ab = new ArrayBuffer(44 + dataBytes);
  const dv = new DataView(ab);
  const str = (off, t) => { for(let i = 0; i < t.length; i++) dv.setUint8(off + i, t.charCodeAt(i)); };

  str(0, 'RIFF'); dv.setUint32(4, 36 + dataBytes, true); str(8, 'WAVE');
  str(12, 'fmt '); dv.setUint32(16, 16, true);
  dv.setUint16(20, 1, true);            /* 1 = PCM */
  dv.setUint16(22, ch, true);
  dv.setUint32(24, sr, true);
  dv.setUint32(28, sr * ch * 2, true);  /* byte rate */
  dv.setUint16(32, ch * 2, true);       /* block align */
  dv.setUint16(34, 16, true);           /* bits per sample */
  str(36, 'data'); dv.setUint32(40, dataBytes, true);

  const chans = [];
  for(let c = 0; c < ch; c++) chans.push(chanOf(buffer, c));
  let off = 44;
  for(let i = 0; i < len; i++){
    for(let c = 0; c < ch; c++){
      let v = chans[c][i] * gain;
      if(v > 1) v = 1; else if(v < -1) v = -1;
      dv.setInt16(off, v < 0 ? v * 0x8000 : v * 0x7FFF, true);
      off += 2;
    }
  }
  return new Blob([ab], { type:'audio/wav' });
}

/* ---------- 导出 UI ---------- */
let expBlob = null, expUrl = null, expName = '', expRunning = false, expToken = 0, expTimer = null;

const expWavBytes = (s) => Math.ceil((s.dur + EXPORT_TAIL) * EXPORT_SR) * 2;
const expMB = (n) => (n / 1048576).toFixed(1) + ' MB';

function exportFilename(s){
  return ('可乐音乐 - ' + String(App.idx + 1).padStart(2, '0') + ' ' + s.title + ' - ' + s.artist + '.wav')
    .replace(/[\\/:*?"<>|]/g, '_');
}

function expState(state, pct, pctText){
  const card = $('expCard');
  if(!card) return;
  card.classList.toggle('busy', state === 'busy');
  card.classList.toggle('done', state === 'done');
  card.classList.toggle('failed', state === 'failed');
  if(pct != null) $('expFill').style.width = (pct * 100).toFixed(1) + '%';
  if(pctText != null) $('expPct').textContent = pctText;
}
/* 移动端贴底时的净空：导出按钮在移动播放页上，此时底部是 .mnp-foot（含音量+控制键，
   高约 171）；若播放页没开、只有 mini bar，则只需让开 64+8。两者差一倍多，
   所以按「当前这条实际可见的底栏」量一次，留 12px 净空。桌面返回 null 不走这条路。 */
/* 底部此刻压着什么 chrome？返回「浮层底边应距视口底多少像素」。
   底部 chrome 在不同页面状态下高度差一倍以上 —— mini bar 是 8+64，
   全屏播放页的 .mnp-foot 是 ~171。写死任何一个数都只在一种状态下成立。
   导出卡和 toast 都吃这个值，所以只在这里算一次。 */
function bottomChromeClearance(){
  if(!(window.matchMedia && matchMedia('(max-width:900px)').matches)) return null;
  const np = $('mobileNp');
  const foot = np && np.classList.contains('open') ? document.querySelector('.mnp-foot') : null;
  const mini = $('miniBar');
  const bar = foot || (mini && mini.classList.contains('show') ? mini : null);
  if(!bar) return 16;
  return Math.max(16, Math.round(window.innerHeight - bar.getBoundingClientRect().top + 12));
}
function showExp(){
  const c = $('expCard');
  const off = bottomChromeClearance();
  if(off != null) c.style.setProperty('--exp-bottom', off + 'px');
  c.classList.add('show');
  c.setAttribute('aria-hidden', 'false');
  setInert(c, false);
}
function hideExp(){
  const c = $('expCard');
  c.classList.remove('show');
  c.setAttribute('aria-hidden', 'true');
  setInert(c, true);
}
function revokeExp(){
  if(expUrl){ URL.revokeObjectURL(expUrl); expUrl = null; }
}
/* 主动保存：留一个按钮，万一浏览器拦了自动下载，用户还有第二次手势机会 */
function saveExp(){
  if(!expBlob) return;
  revokeExp();
  expUrl = URL.createObjectURL(expBlob);
  const a = document.createElement('a');
  a.href = expUrl;
  a.download = expName;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
  /* 结果就写在卡片上，不再叠一层 toast —— 两者会撞在同一个位置 */
  const note = $('expNote');
  if(note) note.textContent = '已保存到下载目录 · ' + expName;
}

async function exportCurrent(){
  if(expRunning){ toast('正在导出，请稍候'); return; }
  const idx = App.idx;
  const s = SONGS[idx];
  const mine = ++expToken;
  expRunning = true;
  revokeExp();
  expBlob = null;
  clearTimeout(expTimer);

  $('expSong').textContent = s.title + ' · ' + s.artist + ' · ' + s.album;
  $('expNote').textContent = '正在离线渲染 ' + fmtTime(s.dur) + ' · 单声道 44.1kHz · ' + expMB(expWavBytes(s));
  expState('busy', 0, '0%');
  showExp();

  try{
    const buf = await renderSong(idx, {
      onProgress: p => {
        if(expToken !== mine) return;
        expState('busy', p, Math.round(p * 100) + '%');
        $('expNote').textContent = '正在离线渲染 · ' + Math.round(p * 100) + '%';
      }
    });
    if(expToken !== mine) return;              /* 用户已经开了下一次导出 */
    const peak = bufferPeak(buf);
    expBlob = encodeWAV(buf, peak > EXPORT_GAIN ? EXPORT_GAIN / peak : 1);
    expName = exportFilename(s);
    expState('done', 1, '100%');
    $('expNote').textContent = '已完成 · ' + expMB(expBlob.size) + ' · 峰值 ' +
      (20 * Math.log10(Math.max(peak, 1e-6))).toFixed(1) + ' dBFS';
    saveExp();
    announce('导出完成：' + s.title);
    expTimer = setTimeout(() => { if(expToken === mine && !expRunning) hideExp(); }, 9000);
  }catch(err){
    if(expToken !== mine) return;
    expState('failed', 0, '失败');
    $('expNote').textContent = '导出失败：' + ((err && err.message) || '未知错误');
    announce('导出失败');
  }finally{
    if(expToken === mine) expRunning = false;
  }
}

/* ============================================================
   7. 事件绑定
   ============================================================ */
function bindTrackDrag(el, apply, commit, readRatio){
  let dragging = false;
  const ratioAt = (e) => {
    const r = el.getBoundingClientRect();
    return clamp((e.clientX - r.left) / r.width, 0, 1);
  };
  el.addEventListener('pointerdown', e => {
    dragging = true;
    el.classList.add('dragging');
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    apply(ratioAt(e));
  });
  el.addEventListener('pointermove', e => { if(dragging) apply(ratioAt(e)); });
  const end = (e) => {
    if(!dragging) return;
    dragging = false;
    el.classList.remove('dragging');
    commit(ratioAt(e));
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', () => {
    dragging = false; el.classList.remove('dragging'); commit(null);
  });
  /* 键盘可达性：方向键步进当前值（进度条读进度，音量条读音量） */
  const read = readRatio || progressRatio;
  el.addEventListener('keydown', e => {
    const step = e.shiftKey ? .1 : .02;
    if(e.key === 'ArrowRight' || e.key === 'ArrowUp'){
      e.preventDefault(); e.stopPropagation();
      apply(clamp(read() + step, 0, 1)); commit(null);
    }else if(e.key === 'ArrowLeft' || e.key === 'ArrowDown'){
      e.preventDefault(); e.stopPropagation();
      apply(clamp(read() - step, 0, 1)); commit(null);
    }
  });
}
function progressRatio(){
  const d = SONGS[App.idx].dur;
  return d ? clamp(Engine.current() / d, 0, 1) : 0;
}

function bindEvents(){
  /* 搜索 */
  const input = $('searchInput');
  input.addEventListener('input', () => {
    App.query = input.value;
    $('searchBox').classList.toggle('has-value', input.value.length > 0);
    renderList();
    renderSuggest();
  });
  input.addEventListener('focus', () => { if(App.query.trim()) renderSuggest(); });
  input.addEventListener('keydown', e => {
    if(e.key === 'Escape'){ input.value = ''; App.query = ''; $('searchBox').classList.remove('has-value'); renderList(); renderSuggest(); input.blur(); }
  });
  $('searchClear').addEventListener('click', () => {
    input.value = ''; App.query = '';
    $('searchBox').classList.remove('has-value');
    renderList(); renderSuggest(); input.focus();
  });
  document.addEventListener('click', e => {
    if(!e.target.closest('.search-zone')) $('suggest').classList.remove('open');
  });
  $('suggest').addEventListener('click', e => {
    const item = e.target.closest('.suggest-item');
    if(!item) return;
    $('suggest').classList.remove('open');
    loadSong(Number(item.dataset.idx), true);
  });

  /* 分类标签 / 「我喜欢」 */
  $('chips').addEventListener('click', e => {
    if(e.target.closest('[data-fav]')){
      App.onlyFav = !App.onlyFav;
      if(App.onlyFav) App.tag = null;
      renderChips(); renderList();
      return;
    }
    const chip = e.target.closest('.chip');
    if(!chip) return;
    App.tag = App.tag === chip.dataset.tag ? null : chip.dataset.tag;
    if(App.tag) App.onlyFav = false;
    renderChips(); renderList();
  });

  /* 列表 */
  $('songList').addEventListener('click', e => {
    const li = e.target.closest('.song');
    if(!li) return;
    const idx = Number(li.dataset.idx);
    const qBtn = e.target.closest('[data-act="queue"]');
    if(qBtn){
      e.stopPropagation();
      if(queueHas(idx)) { const p = App.queue.indexOf(idx); removeQueue(p); }
      else addQueue(idx);
      return;
    }
    const favBtn = e.target.closest('[data-act="fav"]');
    if(favBtn){
      e.stopPropagation();
      if(idx !== App.idx){ App.idx = idx; syncSongUI(); Engine.load(idx, false); }
      toggleFav();
      return;
    }
    if(idx === App.idx){ togglePlay(); }
    else loadSong(idx, true);
  });
  $('songList').addEventListener('keydown', e => {
    if(e.key !== 'Enter' && e.key !== ' ') return;
    if(e.target.closest('button')) return;   /* 让行内按钮走原生激活 */
    const li = e.target.closest('.song');
    if(!li) return;
    e.preventDefault();
    const idx = Number(li.dataset.idx);
    if(idx === App.idx) togglePlay(); else loadSong(idx, true);
  });

  /* 播放控制 */
  $('btnPlay').addEventListener('click', togglePlay);
  $('btnPrev').addEventListener('click', prevSong);
  $('btnNext').addEventListener('click', () => nextSong(false));
  $('mBtnPlay').addEventListener('click', togglePlay);
  $('mBtnPrev').addEventListener('click', prevSong);
  $('mBtnNext').addEventListener('click', () => nextSong(false));
  $('miniPlay').addEventListener('click', e => { e.stopPropagation(); togglePlay(); });
  $('miniNext').addEventListener('click', e => { e.stopPropagation(); nextSong(false); });

  /* 循环 / 随机 */
  const toggleLoop = () => { App.loop = App.loop === 'one' ? 'list' : 'one'; syncLoopUI(); save(); toast(App.loop === 'one' ? '单曲循环' : '列表循环'); };
  $('btnLoop').addEventListener('click', toggleLoop);
  $('mBtnLoop').addEventListener('click', toggleLoop);
  const toggleShuffle = () => { App.shuffle = !App.shuffle; syncLoopUI(); save(); toast(App.shuffle ? '随机播放已开启' : '随机播放已关闭'); };
  $('btnShuffle').addEventListener('click', toggleShuffle);
  $('mBtnShuffle').addEventListener('click', toggleShuffle);
  $('shuffleAll').addEventListener('click', () => {
    App.shuffle = true; syncLoopUI(); save();
    let n = App.idx, guard = 0;
    while(n === App.idx && guard++ < 60) n = Math.floor(Math.random() * SONGS.length);
    loadSong(n, true);
    toast('随机播放已开启');
  });

  /* 收藏 / 分享 / 导出 */
  [$('btnFav'), $('btnFavTop'), $('mnpFav')].forEach(b => b.addEventListener('click', toggleFav));
  $('btnShare').addEventListener('click', () => {
    const s = SONGS[App.idx];
    const txt = s.title + ' - ' + s.artist + '《' + s.album + '》 · 来自可乐音乐播放器';
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(() => toast('歌曲信息已复制到剪贴板'), () => toast(txt));
    }else toast(txt);
  });
  $('btnExport').addEventListener('click', exportCurrent);
  $('mnpExport').addEventListener('click', exportCurrent);
  $('expClose').addEventListener('click', hideExp);
  $('expSave').addEventListener('click', saveExp);

  /* 音量：桌面 */
  $('volWrap').classList.add('open');
  bindTrackDrag($('volSlider'),
    r => { App.vol = r; App.muted = false; applyVol(); syncVolUI(); },
    () => { save(); },
    () => App.vol
  );
  $('btnMute').addEventListener('click', toggleMute);

  /* 音量：移动端（独立于桌面那份数值） */
  bindTrackDrag($('mVol'),
    r => { App.volM = r; App.muted = false; applyVol(); syncVolUI(); },
    () => { save(); },
    () => App.volM
  );
  $('mBtnMute').addEventListener('click', toggleMute);

  const volWrap = $('volWrap');
  volWrap.addEventListener('mouseenter', () => volWrap.classList.add('open'));
  volWrap.addEventListener('mouseleave', () => { if(!isMobile()) volWrap.classList.remove('open'); });

  /* 进度条（桌面 + 移动） */
  const onDrag = (ratio) => {
    App.dragging = true;
    const dur = SONGS[App.idx].dur;
    const cur = ratio * dur;
    const pct = ratio * 100;
    $('trackFill').style.width = pct + '%'; $('trackKnob').style.left = pct + '%';
    $('mTrackFill').style.width = pct + '%'; $('mTrackKnob').style.left = pct + '%';
    $('timeCur').textContent = fmtTime(cur);
    $('mTimeCur').textContent = fmtTime(cur);
  };
  const onCommit = (ratio) => {
    App.dragging = false;
    if(ratio !== null) Engine.seek(ratio * SONGS[App.idx].dur);
    syncPlayUI();
  };
  bindTrackDrag($('track'), onDrag, onCommit);
  bindTrackDrag($('mTrack'), onDrag, onCommit);

  /* 移动端全屏播放页 */
  $('miniBar').addEventListener('click', openMobileNP);
  $('miniBar').addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openMobileNP(); } });
  $('mnpClose').addEventListener('click', closeMobileNP);
  bindSheetGesture();

  /* 队列面板 & 主题 */
  bindQueuePanel();
  $('btnTheme').addEventListener('click', toggleTheme);

  /* 歌词点击跳转 */
  const lyrClick = (e) => {
    const line = e.target.closest('.lrc-line');
    if(!line) return;
    const idx = Array.prototype.indexOf.call(line.parentNode.children, line);
    const tl = App.lyrics[idx];
    if(!tl) return;
    Engine.seek(tl.t + .05);
    if(!Engine.playing){ Engine.start(tl.t + .05); }
    syncPlayUI();
  };
  $('lyricTrack').addEventListener('click', lyrClick);
  $('mLyricTrack').addEventListener('click', lyrClick);

  /* 键盘快捷键 */
  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    if(tag === 'input' || tag === 'textarea') return;
    if(e.key === 'Escape' && App.qpOpen){ e.preventDefault(); closeQueue(); return; }
    if(e.key === 'Escape' && $('expCard').classList.contains('show')){ e.preventDefault(); hideExp(); return; }
    if(e.key === ' '){ e.preventDefault(); togglePlay(); }
    else if(e.key === 'ArrowRight'){ e.preventDefault(); Engine.seek(Engine.current() + 5); syncPlayUI(); }
    else if(e.key === 'ArrowLeft'){ e.preventDefault(); Engine.seek(Engine.current() - 5); syncPlayUI(); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); nudgeVol(.05); }
    else if(e.key === 'ArrowDown'){ e.preventDefault(); nudgeVol(-.05); }
    else if(e.key === 'm' || e.key === 'M'){ toggleMute(); }
    else if(e.key === '/'){ e.preventDefault(); $('searchInput').focus(); }
    else if(e.key.toLowerCase() === 'n'){ nextSong(false); }
    else if(e.key.toLowerCase() === 'p'){ prevSong(); }
    else if(e.key.toLowerCase() === 'q'){ App.qpOpen ? closeQueue() : openQueue(); }
    else if(e.key.toLowerCase() === 't'){ toggleTheme(); }
  });

  /* 切后台时降频 */
  document.addEventListener('visibilitychange', () => {
    if(document.hidden && Engine.timer){ clearInterval(Engine.timer); Engine.timer = null; }
    else if(!document.hidden && Engine.playing && !Engine.timer){ Engine.timer = setInterval(() => Engine.loop(), 25); }
  });

  let lastMobile = isMobile();
  window.addEventListener('resize', () => {
    recenterLyrics();
    /* 跨过断点时切换到该视口对应的那路音量 */
    const m = isMobile();
    if(m !== lastMobile){ lastMobile = m; applyVol(); syncVolUI(); }
  });
  window.addEventListener('orientationchange', () => setTimeout(recenterLyrics, 320));
  window.addEventListener('beforeunload', save);
}

/* ============================================================
   8. 主循环 & 启动
   ============================================================ */
let beatSmooth = 0;
function updateBeat(){
  let target = 0;
  if(Engine.playing && Engine.analyser){
    Engine.analyser.getByteFrequencyData(Engine.freqData);
    const n = 12;               /* 取低频段：底鼓与贝斯 */
    let sum = 0;
    for(let i = 1; i < n; i++) sum += Engine.freqData[i];
    target = Math.min(1, (sum / (n - 1)) / 255 * 1.45);
  }
  /* 起得快、落得慢，接近心跳的观感 */
  beatSmooth = target > beatSmooth ? target : beatSmooth * .85 + target * .15;
  if(!Engine.playing && beatSmooth < .012) beatSmooth = 0;
  if(Math.abs(beatSmooth - App.beat) > .006){
    App.beat = beatSmooth;
    document.documentElement.style.setProperty('--beat', beatSmooth.toFixed(3));
  }
}

function rafLoop(){
  const s = SONGS[App.idx];
  const cur = Engine.current();
  renderProgress(cur, s.dur);
  updateLyric(cur);
  updateBeat();
  requestAnimationFrame(rafLoop);
}

Engine.onEnd = function(){
  if(App.loop === 'one' && !App.shuffle && !App.queue.length){ this.seek(0); this.start(0); syncPlayUI(); return; }
  nextSong(true);
};

function init(){
  restore();
  initTheme();
  Engine.vol = activeVol();
  Engine.muted = App.muted;
  renderChips();
  renderList();
  Engine.load(App.idx, false);
  syncSongUI();
  syncVolUI();
  syncLoopUI();
  syncPlayUI();
  renderQueue();
  bindEvents();
  requestAnimationFrame(rafLoop);
  setTimeout(() => { if(!Engine.ctx) toast('点击播放按钮开始 · 全部音乐实时合成'); }, 900);
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
