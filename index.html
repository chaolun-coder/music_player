<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#08080B">
<meta name="description" content="可乐音乐 · 个人播放器 · 播放控制 / 歌单 / 歌词 / 搜索">
<title>可乐音乐 · 个人播放器</title>
<script>
/* 首屏无闪烁：在样式生效前定主题 */
(function(){
  try{
    var t = localStorage.getItem('cola.theme.v1');
    if(t !== 'light' && t !== 'dark'){
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    }
    if(t === 'light') document.documentElement.setAttribute('data-theme', 'light');
  }catch(e){}
})();
</script>
<style>
/* ============================================================
   可乐音乐 · 个人播放器
   设计语言：抖音系深黑底 + 黄绿极光渐变 + 粗体字 + 毛玻璃
   ============================================================ */

:root{
  /* 背景层 */
  --bg:#08080B;
  --bg-2:#0E0E13;
  --surface:#15151C;
  --surface-2:#1D1D26;
  --surface-3:#26262F;
  --shell-grad:linear-gradient(180deg,#101017 0%,#0A0A0E 100%);
  --pop-bg:#1A1A22;
  --glass-bg:rgba(28,28,36,.82);
  --toast-bg:rgba(30,30,38,.94);
  --scrim:rgba(0,0,0,.5);

  /* 描边 */
  --line:rgba(255,255,255,.07);
  --line-strong:rgba(255,255,255,.14);

  /* 文字 */
  --text:#F2F4F3;
  --text-2:#9BA0A6;
  --text-3:#7E848C;

  /* 交互态：悬停底色 / 轨道底色 / 旋钮 */
  --hover:rgba(255,255,255,.06);
  --hover-2:rgba(255,255,255,.07);
  --track-bg:rgba(255,255,255,.1);
  --track-buf:rgba(255,255,255,.13);
  --knob:#FFFFFF;
  --scroll-thumb:rgba(255,255,255,.09);
  --scroll-thumb-hover:rgba(255,255,255,.18);

  /* 阴影与遮罩 */
  --shadow-lg:rgba(0,0,0,.9);
  --shadow-xl:rgba(0,0,0,.95);
  --fade-a:rgba(8,8,11,.35);
  --fade-b:rgba(8,8,11,.86);
  --cover-inset:rgba(255,255,255,.07);
  --focus-bg:#181820;
  --lyric-glow:rgba(255,74,61,.34);

  /* 品牌：可乐红金渐变 */
  --brand-1:#FF4A3D;
  --brand-2:#FFAD33;
  --brand-grad:linear-gradient(135deg,#FF4A3D 0%,#FFAD33 100%);
  --brand-soft:rgba(255,74,61,.14);
  --brand-glow:rgba(255,74,61,.4);
  --brand-edge:rgba(255,74,61,.4);
  --brand-on:rgba(255,74,61,.11);
  --brand-on-2:rgba(255,173,51,.05);
  --brand-rgb:255,74,61;
  --on-brand:#1A0503;
  --like:#FF5C7A;
  --like-soft:rgba(255,92,122,.12);
  --like-edge:rgba(255,92,122,.4);
  --mini-a:#2A2A34;
  --mini-b:#1A1A22;

  /* 极光（随歌曲变化） */
  --glow-a:rgba(255,74,61,.55);
  --glow-b:rgba(255,173,51,.5);
  --glow-op:.42;

  /* 圆角 */
  --r-xl:32px;
  --r-lg:24px;
  --r-md:16px;
  --r-sm:10px;

  /* 动效曲线 */
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-io:cubic-bezier(.65,0,.35,1);

  --bar-h:78px;
}

/* ============================================================
   浅色主题 · Creative_Light（琥珀 + 墨绿 · 画廊质感）
   ============================================================ */
[data-theme="light"]{
  --bg:#FBF8F2;
  --bg-2:#F4EFE4;
  --surface:#FFFFFF;
  --surface-2:#F3EEE4;
  --surface-3:#E8E1D2;
  --shell-grad:linear-gradient(180deg,#FFFFFF 0%,#F7F2E8 100%);
  --pop-bg:#FFFFFF;
  --glass-bg:rgba(255,255,255,.86);
  --toast-bg:rgba(22,48,42,.94);
  --scrim:rgba(22,48,42,.28);

  --line:rgba(22,48,42,.10);
  --line-strong:rgba(22,48,42,.20);

  --text:#16302A;
  --text-2:#566A63;
  --text-3:#667169;

  --hover:rgba(22,48,42,.055);
  --hover-2:rgba(22,48,42,.075);
  --track-bg:rgba(22,48,42,.12);
  --track-buf:rgba(22,48,42,.18);
  --knob:#FFFFFF;
  --scroll-thumb:rgba(22,48,42,.16);
  --scroll-thumb-hover:rgba(22,48,42,.28);

  --shadow-lg:rgba(60,48,26,.16);
  --shadow-xl:rgba(60,48,26,.22);
  --fade-a:rgba(251,248,242,.30);
  --fade-b:rgba(251,248,242,.90);
  --cover-inset:rgba(255,255,255,.5);
  --focus-bg:#FFFFFF;
  --lyric-glow:rgba(30,84,69,.16);

  /* 墨绿主色 + 琥珀辅色 */
  --brand-1:#1E5445;
  --brand-2:#A9721A;
  --brand-grad:linear-gradient(135deg,#1F5445 0%,#A9721A 100%);
  --brand-soft:rgba(30,84,69,.10);
  --brand-glow:rgba(30,84,69,.26);
  --brand-edge:rgba(30,84,69,.36);
  --brand-on:rgba(30,84,69,.10);
  --brand-on-2:rgba(192,137,30,.07);
  --brand-rgb:30,84,69;
  --on-brand:#FFFFFF;
  --like:#D3455F;
  --like-soft:rgba(211,69,95,.10);
  --like-edge:rgba(211,69,95,.38);
  --mini-a:#2E6B57;
  --mini-b:#1B4C3F;

  --glow-op:.34;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{height:100%;margin:0;padding:0}

body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  font-size:14px;
  line-height:1.5;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}

button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;outline:none}
ul,ol{margin:0;padding:0;list-style:none}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--scroll-thumb-hover);background-clip:padding-box}

::selection{background:var(--brand-soft);color:var(--brand-1)}

/* ---------- 布局骨架 ---------- */
.app{
  display:flex;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  position:relative;
}

/* ============================================================
   左栏：品牌 / 搜索 / 歌单
   ============================================================ */
.panel-left{
  position:relative;
  flex:0 0 388px;
  width:388px;
  display:flex;
  flex-direction:column;
  min-height:0;
  border-right:1px solid var(--line);
  background:var(--shell-grad);
  transition:background .4s var(--ease);
  z-index:5;
}
/* 左上角极光 · 品牌标志性元素 */
.panel-left::before{
  content:'';
  position:absolute;
  top:-160px;left:-120px;
  width:420px;height:420px;
  border-radius:50%;
  background:radial-gradient(circle at 50% 50%,var(--glow-a) 0%,transparent 68%);
  filter:blur(58px);
  opacity:.5;
  pointer-events:none;
  transition:background .9s var(--ease);
}

.brand{
  position:relative;
  display:flex;
  align-items:center;
  gap:11px;
  padding:26px 24px 18px;
  flex:0 0 auto;
}
.brand-logo{
  width:38px;height:38px;
  border-radius:12px;
  background:var(--brand-grad);
  display:grid;place-items:center;
  box-shadow:0 6px 22px -6px var(--brand-glow);
  flex:0 0 auto;
}
.brand-logo svg{width:20px;height:20px;display:block}
.brand-text{min-width:0}
.brand-name{
  font-size:19px;
  font-weight:800;
  letter-spacing:.5px;
  line-height:1.15;
  background:var(--brand-grad);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.brand-sub{
  font-size:11px;
  color:var(--text-3);
  letter-spacing:1.6px;
  text-transform:uppercase;
  margin-top:1px;
}

/* ---------- 搜索 ---------- */
.search-zone{
  position:relative;
  padding:0 24px 14px;
  flex:0 0 auto;
  z-index:20;
}
.search-box{
  display:flex;
  align-items:center;
  gap:9px;
  height:44px;
  padding:0 14px;
  border-radius:14px;
  background:var(--surface);
  border:1px solid var(--line);
  transition:border-color .25s var(--ease),background .25s var(--ease),box-shadow .25s var(--ease);
}
.search-box:focus-within{
  border-color:var(--brand-edge);
  background:var(--focus-bg);
  box-shadow:0 0 0 4px var(--brand-soft);
}
.search-box svg{width:16px;height:16px;flex:0 0 auto;opacity:.5}
.search-box input{flex:1;min-width:0;height:100%;font-size:14px}
.search-box input::placeholder{color:var(--text-3)}
.search-clear{
  width:20px;height:20px;border-radius:50%;
  display:none;place-items:center;
  background:var(--surface-3);
  flex:0 0 auto;
}
.search-clear svg{width:10px;height:10px;opacity:.75}
.search-box.has-value .search-clear{display:grid}

/* 搜索联想 */
.suggest{
  position:absolute;
  left:24px;right:24px;top:52px;
  background:var(--pop-bg);
  border:1px solid var(--line-strong);
  border-radius:16px;
  padding:6px;
  box-shadow:0 22px 48px -12px var(--shadow-lg);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  max-height:300px;
  overflow-y:auto;
  display:none;
  z-index:30;
}
.suggest.open{display:block;animation:suggestIn .22s var(--ease)}
@keyframes suggestIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.suggest-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 11px;border-radius:11px;
  cursor:pointer;
  transition:background .15s;
}
.suggest-item:hover,.suggest-item.active{background:var(--hover)}
.suggest-item .si-icon{width:26px;height:26px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;font-size:12px;background:var(--surface-3)}
.suggest-item .si-main{min-width:0;flex:1}
.suggest-item .si-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.suggest-item .si-sub{font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.suggest-item mark{background:transparent;color:var(--brand-1);font-weight:700}

/* ---------- 热门标签 ---------- */
.chips{
  display:flex;gap:7px;flex-wrap:wrap;
  padding:0 24px 14px;
  flex:0 1 auto;
  min-width:0;
  max-width:100%;
}
.chip{
  font-size:12px;
  padding:6px 12px;
  border-radius:99px;
  background:var(--surface);
  border:1px solid var(--line);
  color:var(--text-2);
  white-space:nowrap;
  transition:all .2s var(--ease);
}
.chip:hover{color:var(--text);border-color:var(--line-strong);transform:translateY(-1px)}
.chip.on{background:var(--brand-soft);border-color:var(--brand-edge);color:var(--brand-1)}
/* 「我喜欢」入口 */
.chip-fav{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto}
.chip-fav svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;transition:fill .2s}
.chip-fav.on svg{fill:currentColor}

/* ---------- 列表头 ---------- */
.list-head{
  display:flex;align-items:baseline;justify-content:space-between;
  padding:6px 24px 10px;
  flex:0 0 auto;
}
.list-title{font-size:15px;font-weight:800;letter-spacing:.3px}
.list-title em{font-style:normal;color:var(--brand-1)}
.list-count{font-size:11px;color:var(--text-3);letter-spacing:.5px}
.list-tools{display:flex;gap:6px;align-items:center}
.mini-btn{
  font-size:11px;color:var(--text-3);
  padding:4px 9px;border-radius:99px;
  border:1px solid var(--line);
  transition:all .2s var(--ease);
}
.mini-btn:hover{color:var(--brand-1);border-color:var(--brand-edge)}

/* ---------- 歌曲列表 ---------- */
.song-scroll{
  flex:1 1 auto;
  min-height:0;
  min-width:0;
  overflow-y:auto;
  overflow-x:hidden;
  padding:0 14px 20px;
  overscroll-behavior:contain;
  scroll-behavior:smooth;
}

.song{
  position:relative;
  display:flex;
  align-items:center;
  gap:12px;
  padding:9px 10px;
  border-radius:16px;
  cursor:pointer;
  transition:background .2s var(--ease);
  --c1:var(--mini-a);--c2:var(--mini-b);
}
.song:hover{background:var(--hover)}
.song.on{background:linear-gradient(90deg,var(--brand-on),var(--brand-on-2))}
.song.on::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:22px;border-radius:99px;
  background:var(--brand-grad);
  box-shadow:0 0 12px var(--brand-glow);
}

.song-cover{
  position:relative;
  width:46px;height:46px;
  border-radius:13px;
  flex:0 0 auto;
  background:linear-gradient(135deg,var(--c1),var(--c2));
  display:grid;place-items:center;
  overflow:hidden;
  box-shadow:0 4px 14px -6px var(--shadow-lg);
}
.song-cover::after{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.22) 1px,transparent 1px);
  background-size:7px 7px;
  opacity:.5;
}
.song-cover .glyph{
  position:relative;z-index:1;
  font-size:19px;font-weight:700;
  color:rgba(255,255,255,.92);
  text-shadow:0 1px 6px rgba(0,0,0,.35);
}
/* 悬停浮层播放键 */
.song-play{
  position:absolute;inset:0;z-index:3;
  display:grid;place-items:center;
  background:rgba(0,0,0,.52);
  backdrop-filter:blur(1.5px);
  -webkit-backdrop-filter:blur(1.5px);
  opacity:0;
  transition:opacity .18s var(--ease);
}
.song-play svg{width:15px;height:15px;fill:#fff}
.song-play .ico-s{display:none}
.song.on .song-play .ico-p{display:none}
.song.on .song-play .ico-s{display:block}
.song:hover .song-play,.song:focus-visible .song-play{opacity:1}

.song-main{flex:1;min-width:0}
.song-title{
  font-size:14px;font-weight:650;
  letter-spacing:.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:6px;
}
.song.on .song-title{color:var(--brand-1)}
.song-sub{
  font-size:11.5px;color:var(--text-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-top:2px;
}
.tag-hq{
  font-size:9px;font-weight:800;
  padding:1px 4px;border-radius:4px;
  border:1px solid var(--brand-edge);
  color:var(--brand-1);
  letter-spacing:.4px;
  flex:0 0 auto;
  line-height:1.4;
}

.song-act{
  display:flex;align-items:center;gap:2px;
  flex:0 0 auto;
}
.icon-btn{
  width:32px;height:32px;
  border-radius:50%;
  display:grid;place-items:center;
  color:var(--text-3);
  transition:color .2s,background .2s,transform .2s var(--ease);
}
.icon-btn:hover{color:var(--text);background:var(--hover-2)}
.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:16px;height:16px}
.icon-btn.liked{color:var(--like)}
.icon-btn.liked svg{fill:var(--like);stroke:var(--like)}
.icon-btn.like-pop svg{animation:pop .42s var(--ease)}
@keyframes pop{0%{transform:scale(1)}42%{transform:scale(1.42)}100%{transform:scale(1)}}

.song-dur{
  font-size:11px;color:var(--text-3);
  font-variant-numeric:tabular-nums;
  flex:0 0 auto;
  min-width:36px;text-align:right;
}

/* 播放中均衡器 */
.eq{display:none;align-items:flex-end;gap:2px;height:14px;width:26px;flex:0 0 auto;padding-right:4px}
.song.on .eq{display:flex}
.song.on .song-dur{display:none}
.eq i{
  display:block;width:2.5px;border-radius:2px;
  background:var(--brand-grad);
  height:4px;
  animation:eqBar .9s var(--ease-io) infinite alternate;
  transform-origin:bottom;
}
.eq i:nth-child(1){animation-delay:-.5s}
.eq i:nth-child(2){animation-delay:-.15s}
.eq i:nth-child(3){animation-delay:-.75s}
.eq i:nth-child(4){animation-delay:-.32s}
@keyframes eqBar{from{height:3px}to{height:14px}}
.eq.paused i{animation-play-state:paused;opacity:.35}

/* 空状态 */
.empty{
  padding:52px 24px;
  text-align:center;
  color:var(--text-3);
}
.empty-badge{
  width:62px;height:62px;margin:0 auto 14px;
  border-radius:20px;
  background:var(--surface);
  border:1px solid var(--line);
  display:grid;place-items:center;
  font-size:24px;
  opacity:.65;
}
.empty h4{margin:0 0 5px;font-size:14px;color:var(--text-2);font-weight:650}
.empty p{margin:0;font-size:12px;line-height:1.7}

/* ============================================================
   右栏：正在播放
   ============================================================ */
.panel-right{
  position:relative;
  flex:1 1 auto;
  min-width:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.panel-right::before{
  content:'';
  position:absolute;
  inset:-25% -10% auto -10%;
  height:110%;
  background:
    radial-gradient(46% 42% at 22% 6%,var(--glow-a) 0%,transparent 62%),
    radial-gradient(42% 38% at 82% 22%,var(--glow-b) 0%,transparent 62%);
  filter:blur(64px);
  opacity:var(--glow-op);
  pointer-events:none;
  transition:background 1s var(--ease);
}
.panel-right::after{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(180deg,var(--fade-a) 0%,var(--fade-b) 62%,var(--bg) 100%);
  pointer-events:none;
  transition:background .4s var(--ease);
}

.np-scroll{
  position:relative;
  z-index:2;
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:0 40px;
  overflow-y:auto;
  overscroll-behavior:contain;
}

/* 顶部工具行 */
.np-top{
  width:100%;
  max-width:640px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 0 6px;
  flex:0 0 auto;
}
.np-label{
  font-size:11px;letter-spacing:2.4px;text-transform:uppercase;
  color:var(--text-3);font-weight:700;
  display:flex;align-items:center;gap:7px;
}
.pulse{
  width:6px;height:6px;border-radius:50%;
  background:var(--brand-1);
  box-shadow:0 0 0 0 var(--brand-glow);
  animation:pulse 1.9s infinite;
}
.pulse.off{background:var(--text-3);box-shadow:none;animation:none}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(var(--brand-rgb),.5)}
  70%{box-shadow:0 0 0 9px rgba(var(--brand-rgb),0)}
  100%{box-shadow:0 0 0 0 rgba(var(--brand-rgb),0)}
}
.np-top-acts{display:flex;gap:4px}

/* 封面 */
.cover-wrap{
  position:relative;
  flex:0 0 auto;
  margin:16px 0 20px;
}
.cover-halo{
  position:absolute;
  inset:-16% -16% -20%;
  border-radius:50%;
  background:radial-gradient(circle at 50% 50%,var(--halo-a,var(--brand-1)) 0%,transparent 66%);
  filter:blur(48px);
  opacity:calc(.22 + var(--beat,0) * .46);
  transform:scale(calc(1 + var(--beat,0) * .16));
  transition:background .9s var(--ease);
  pointer-events:none;
  will-change:transform,opacity;
}
.cover{
  position:relative;
  width:236px;height:236px;
  border-radius:var(--r-xl);
  background:linear-gradient(135deg,var(--c1),var(--c2));
  display:grid;place-items:center;
  overflow:hidden;
  box-shadow:
    0 30px 70px -24px var(--shadow-xl),
    0 0 0 1px var(--cover-inset) inset;
  transition:transform .6s var(--ease),box-shadow .6s var(--ease);
}
.cover::before{
  content:'';
  position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.26) 1.4px,transparent 1.4px);
  background-size:13px 13px;
  opacity:.36;
}
.cover::after{
  content:'';
  position:absolute;
  inset:auto -30% -55% -30%;
  height:100%;
  border-radius:50%;
  background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.3) 0%,transparent 62%);
  opacity:.55;
}
.cover-glyph{
  position:relative;
  z-index:2;
  font-size:88px;
  font-weight:800;
  color:rgba(255,255,255,.95);
  text-shadow:0 6px 26px rgba(0,0,0,.4);
  line-height:1;
  letter-spacing:-4px;
}
.cover-idx{
  position:absolute;
  right:18px;bottom:14px;
  z-index:2;
  font-size:11px;
  font-weight:800;
  letter-spacing:1.6px;
  color:rgba(255,255,255,.7);
  font-variant-numeric:tabular-nums;
}
.playing .cover{transform:scale(calc(1.012 + var(--beat,0) * .03))}
/* 切歌时的封面过渡 */
.cover.cover-swap{animation:coverSwap .5s var(--ease)}
@keyframes coverSwap{
  0%{opacity:.25;transform:scale(.9) rotate(-2.5deg);filter:blur(7px)}
  60%{opacity:1;filter:blur(0)}
  100%{opacity:1;transform:scale(1) rotate(0);filter:blur(0)}
}

/* 歌曲信息 */
.np-info{
  width:100%;max-width:640px;
  display:flex;align-items:center;gap:16px;
  flex:0 0 auto;
}
.np-text{flex:1;min-width:0;text-align:left}
.np-title{
  font-size:24px;font-weight:800;
  letter-spacing:-.3px;
  line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.np-artist{
  font-size:13.5px;color:var(--text-2);
  margin-top:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.np-artist b{color:var(--text);font-weight:600}
.np-like{
  width:46px;height:46px;border-radius:50%;
  background:var(--surface);
  border:1px solid var(--line);
  display:grid;place-items:center;
  color:var(--text-2);
  flex:0 0 auto;
  transition:all .22s var(--ease);
}
.np-like:hover{color:var(--text);border-color:var(--line-strong);transform:scale(1.06)}
.np-like svg{width:20px;height:20px}
.np-like.liked{color:var(--like);border-color:var(--like-edge);background:var(--like-soft)}
.np-like.liked svg{fill:var(--like);stroke:var(--like)}

/* 歌词 */
.lyric-zone{
  position:relative;
  width:100%;max-width:640px;
  flex:1 1 auto;
  min-height:168px;
  margin:16px 0 0;
  overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 86%,transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 86%,transparent 100%);
}
.lyric-track{
  position:absolute;
  left:0;right:0;top:0;
  padding:0;
  transition:transform .62s var(--ease);
  will-change:transform;
}
.lrc-line{
  font-size:17px;
  font-weight:600;
  color:var(--text-3);
  padding:9px 0;
  line-height:1.45;
  letter-spacing:.2px;
  transition:color .38s var(--ease),transform .48s var(--ease),opacity .38s var(--ease),filter .38s var(--ease);
  transform-origin:left center;
  cursor:pointer;
  opacity:.52;
}
.lrc-line:hover{color:var(--text-2);opacity:.85}
.lrc-line.cur{
  color:var(--brand-1);
  font-size:22px;
  font-weight:800;
  letter-spacing:-.2px;
  opacity:1;
  transform:translateX(6px);
  text-shadow:0 0 26px var(--lyric-glow);
}
.lrc-line.near{color:var(--text-2);opacity:.78}
.lrc-line.past{opacity:.4}
.lrc-line:empty{height:14px;padding:0}
.lrc-interlude{
  display:inline-flex;align-items:center;gap:8px;
  color:var(--text-3);font-size:13px;font-weight:600;
}
.lrc-interlude i{
  width:5px;height:5px;border-radius:50%;background:var(--brand-1);
  animation:interlude 1.3s infinite;
}
.lrc-interlude i:nth-child(2){animation-delay:.18s}
.lrc-interlude i:nth-child(3){animation-delay:.36s}
@keyframes interlude{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}

/* ============================================================
   底部控制条
   ============================================================ */
.player-bar{
  position:relative;
  z-index:8;
  flex:0 0 auto;
  padding:0 40px 18px;
  background:linear-gradient(180deg,transparent,var(--bg) 40%);
}
.pb-inner{
  width:100%;
  max-width:640px;
  margin:0 auto;
}

/* 进度条 */
.progress-row{
  display:flex;align-items:center;gap:13px;
  padding:0 0 4px;
}
.time{
  font-size:11px;color:var(--text-3);
  font-variant-numeric:tabular-nums;
  min-width:38px;
  flex:0 0 auto;
}
.time.r{text-align:right}

.track{
  position:relative;
  flex:1 1 auto;
  height:22px;
  display:flex;align-items:center;
  cursor:pointer;
  touch-action:none;
}
.track-bg{
  position:absolute;left:0;right:0;
  height:2px;border-radius:99px;
  background:var(--track-bg);
  overflow:hidden;
}
.track-buf{
  position:absolute;left:0;top:0;bottom:0;
  width:0%;
  background:var(--track-buf);
  border-radius:99px;
}
.track-fill{
  position:absolute;left:0;top:0;bottom:0;
  width:0%;
  background:rgba(var(--brand-rgb),.65);
  border-radius:99px;
  box-shadow:none;
  transition:height .2s var(--ease),background .2s var(--ease),box-shadow .2s var(--ease);
}
.track:hover .track-fill,
.track.dragging .track-fill{
  background:var(--brand-grad);
}
.track-knob{
  position:absolute;
  left:0;top:50%;
  width:13px;height:13px;
  margin-left:-6.5px;
  border-radius:50%;
  background:var(--knob);
  transform:translateY(-50%) scale(0);
  transition:transform .2s var(--ease);
  box-shadow:0 2px 10px var(--shadow-lg);
  pointer-events:none;
}
.track:hover .track-knob,.track.dragging .track-knob{transform:translateY(-50%) scale(1)}
.track.dragging .track-fill{box-shadow:0 0 16px rgba(var(--brand-rgb),.55)}
.track:hover .track-bg{height:4px}
.track-bg,.track-buf{transition:height .2s var(--ease)}

/* 按钮行 */
.ctrl-row{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;
  padding-top:2px;
}
.ctrl-group{display:flex;align-items:center;gap:4px}

.cbtn{
  position:relative;
  width:40px;height:40px;
  border-radius:50%;
  display:grid;place-items:center;
  color:var(--text-2);
  transition:color .2s,background .2s,transform .18s var(--ease);
}
.cbtn:hover{color:var(--text);background:var(--hover-2)}
.cbtn:active{transform:scale(.9)}
.cbtn svg{width:19px;height:19px}
.cbtn.active{color:var(--brand-1)}
.cbtn.active::after{
  content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--brand-1);
}
/* 单曲循环：右上角「1」角标 */
.cbtn.loop-one{color:var(--brand-1)}
.cbtn.loop-one::before{
  content:'1';
  position:absolute;
  top:2px;right:1px;
  width:14px;height:14px;
  border-radius:5px;
  background:var(--brand-1);
  color:var(--on-brand);
  font-size:9px;
  font-weight:800;
  line-height:14px;
  text-align:center;
  box-shadow:0 0 0 2px var(--bg);
}

.play-btn{
  width:58px;height:58px;
  border-radius:50%;
  background:var(--brand-grad);
  color:#FFF;
  display:grid;place-items:center;
  box-shadow:
    0 10px 30px -8px var(--brand-glow),
    0 0 0 calc(var(--beat,0) * 8px) rgba(var(--brand-rgb),.16);
  transition:transform .2s var(--ease),box-shadow .12s linear;
  flex:0 0 auto;
}
.play-btn:hover{
  transform:scale(1.06);
  box-shadow:
    0 14px 38px -8px var(--brand-glow),
    0 0 0 calc(var(--beat,0) * 11px) rgba(var(--brand-rgb),.2);
}
.play-btn:active{transform:scale(.95)}
.play-btn svg{width:24px;height:24px}
.play-btn.loading{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 音量 */
.vol-wrap{display:flex;align-items:center;gap:2px}
.vol-slider{
  position:relative;
  width:0;
  height:22px;
  overflow:hidden;
  transition:width .32s var(--ease),opacity .32s var(--ease);
  opacity:0;
  display:flex;align-items:center;
  cursor:pointer;
  touch-action:none;
}
.vol-wrap:hover .vol-slider,.vol-wrap.open .vol-slider{width:78px;opacity:1}
.vol-bg{position:absolute;left:6px;right:6px;height:4px;border-radius:99px;background:var(--track-bg)}
.vol-fill{position:absolute;left:6px;height:4px;border-radius:99px;background:var(--brand-grad);width:70%}
.vol-knob{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--knob);transform:translateX(-50%);left:70%;box-shadow:0 1px 6px var(--shadow-lg)}

/* 底部信息 */
.pb-foot{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 0 0;
  border-top:1px solid var(--line);
  margin-top:14px;
  font-size:11px;
  color:var(--text-3);
  letter-spacing:.3px;
}
.pb-foot .kbd-hint{display:flex;gap:12px;align-items:center}
.pb-foot kbd{
  font-family:inherit;
  font-size:10px;
  padding:2px 6px;
  border-radius:5px;
  background:var(--surface-2);
  border:1px solid var(--line);
  color:var(--text-2);
  margin:0 2px;
}
.engine-tag{
  display:inline-flex;align-items:center;gap:6px;
  color:var(--text-2);
}
.engine-tag i{width:6px;height:6px;border-radius:50%;background:var(--brand-1);box-shadow:0 0 8px var(--brand-glow)}

/* ============================================================
   移动端 mini bar（桌面隐藏）
   ============================================================ */
.mini-bar{
  display:none;
  position:fixed;
  left:8px;right:8px;
  bottom:calc(8px + env(safe-area-inset-bottom,0px));
  height:64px;
  border-radius:20px;
  background:var(--glass-bg);
  border:1px solid var(--line-strong);
  backdrop-filter:blur(24px) saturate(1.4);
  -webkit-backdrop-filter:blur(24px) saturate(1.4);
  box-shadow:0 14px 40px -12px var(--shadow-lg);
  align-items:center;
  gap:10px;
  padding:0 10px 0 8px;
  z-index:40;
  transform:translateY(140%);
  transition:transform .45s var(--ease);
}
.mini-bar.show{transform:none}
.mini-cover{
  width:44px;height:44px;border-radius:13px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--c1,var(--mini-a)),var(--c2,var(--mini-b)));
  display:grid;place-items:center;
  font-size:18px;font-weight:700;color:rgba(255,255,255,.9);
  position:relative;overflow:hidden;
}
.mini-cover::after{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.22) 1px,transparent 1px);
  background-size:6px 6px;opacity:.45;
}
.mini-main{flex:1;min-width:0}
.mini-title{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-sub{font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}

/* 移动端全屏播放页 */
.mobile-np{
  display:none;
  position:fixed;
  inset:0;
  z-index:60;
  background:var(--bg);
  flex-direction:column;
  transform:translateY(100%);
  transition:transform .46s var(--ease),visibility .46s linear;
  overflow:hidden;
  visibility:hidden;   /* 同上：整页移出视口时它的按钮仍会被 Tab 逐个命中 */
}
.mobile-np.open{transform:none;visibility:visible}
[data-theme="light"] .mobile-np::before{opacity:.32}
.mobile-np::before{
  content:'';position:absolute;inset:-20% -20% auto -20%;height:80%;
  background:
    radial-gradient(46% 40% at 24% 4%,var(--glow-a) 0%,transparent 62%),
    radial-gradient(42% 36% at 80% 20%,var(--glow-b) 0%,transparent 62%);
  filter:blur(56px);opacity:.5;pointer-events:none;
  transition:background 1s var(--ease);
}
.mnp-head{
  position:relative;z-index:2;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(14px + env(safe-area-inset-top,0px)) 18px 6px;
  flex:0 0 auto;
}
.mnp-body{
  position:relative;z-index:2;
  flex:1;min-height:0;
  display:flex;flex-direction:column;
  padding:0 26px;
  overflow:hidden;
}
.mnp-foot{
  position:relative;z-index:2;
  flex:0 0 auto;
  padding:0 26px calc(22px + env(safe-area-inset-bottom,0px));
}

/* ============================================================
   主题切换
   ============================================================ */
.brand-acts{margin-left:auto;display:flex;align-items:center;gap:6px;flex:0 0 auto}
.theme-btn{
  width:36px;height:36px;
  border-radius:12px;
  display:grid;place-items:center;
  color:var(--text-2);
  background:var(--surface);
  border:1px solid var(--line);
  transition:color .25s var(--ease),background .25s var(--ease),border-color .25s var(--ease),transform .25s var(--ease);
}
.theme-btn:hover{color:var(--brand-1);border-color:var(--brand-edge);transform:translateY(-1px)}
.theme-btn:active{transform:scale(.93)}
.theme-btn svg{width:17px;height:17px}
.theme-btn .t-sun{display:none}
[data-theme="light"] .theme-btn .t-sun{display:block}
[data-theme="light"] .theme-btn .t-moon{display:none}

/* ============================================================
   播放队列（桌面：右侧抽屉 / 移动：底部面板）
   ============================================================ */
.scrim{
  position:fixed;inset:0;z-index:70;
  background:var(--scrim);
  opacity:0;pointer-events:none;
  transition:opacity .32s var(--ease);
}
.scrim.show{opacity:1;pointer-events:auto}

.queue-panel{
  position:fixed;
  z-index:71;
  top:0;right:0;bottom:0;
  width:354px;
  display:flex;flex-direction:column;
  background:var(--bg-2);
  border-left:1px solid var(--line-strong);
  box-shadow:-26px 0 64px -22px var(--shadow-xl);
  transform:translateX(103%);
  transition:transform .44s var(--ease),visibility .44s linear;
  will-change:transform;
  visibility:hidden;   /* 移出屏幕 ≠ 移出焦点序列，必须显式摘掉 */
}
.queue-panel.open{transform:none;visibility:visible}
[hidden]{display:none !important}

.qp-head{
  position:relative;
  display:flex;align-items:center;gap:8px;
  padding:16px 16px 12px;
  flex:0 0 auto;
  border-bottom:1px solid var(--line);
}
.qp-title{flex:1;min-width:0;font-size:15px;font-weight:800;letter-spacing:.3px}
.qp-title em{font-style:normal;color:var(--brand-1);font-variant-numeric:tabular-nums}
.qp-btn{
  font-size:11px;color:var(--text-3);
  padding:5px 10px;border-radius:99px;
  border:1px solid var(--line);
  white-space:nowrap;
  transition:all .2s var(--ease);
}
.qp-btn:hover{color:var(--brand-1);border-color:var(--brand-edge)}
.qp-btn:disabled{opacity:.35;cursor:not-allowed;color:var(--text-3);border-color:var(--line)}
.qp-close{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;color:var(--text-3);transition:all .2s var(--ease)}
.qp-close:hover{color:var(--text);background:var(--hover-2)}
.qp-close svg{width:15px;height:15px}

.qp-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:4px 10px 22px;overscroll-behavior:contain}
.qp-sec{
  display:flex;align-items:baseline;gap:8px;
  padding:15px 8px 7px;
  font-size:10.5px;letter-spacing:1.7px;text-transform:uppercase;
  color:var(--text-3);font-weight:700;
}
.qp-sec span{margin-left:auto;letter-spacing:.3px;text-transform:none;font-weight:600;font-size:10.5px}
.qp-hint{
  margin:0 8px 8px;padding:9px 11px;border-radius:11px;
  background:var(--brand-soft);color:var(--brand-1);
  font-size:11px;line-height:1.6;
}

.qp-item{
  position:relative;
  display:flex;align-items:center;gap:10px;
  padding:7px 8px;border-radius:13px;
  cursor:pointer;
  text-align:left;width:100%;
  transition:background .2s var(--ease);
}
.qp-item:hover{background:var(--hover)}
.qp-item.now{background:linear-gradient(90deg,var(--brand-on),transparent)}
.qp-item.now .qp-name{color:var(--brand-1)}
.qp-item.preview .qp-name{color:var(--text-2)}
.qp-num{
  width:15px;flex:0 0 auto;text-align:center;
  font-size:10.5px;color:var(--text-3);font-variant-numeric:tabular-nums;
}
.qp-cover{
  width:36px;height:36px;border-radius:11px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--c1,var(--mini-a)),var(--c2,var(--mini-b)));
  display:grid;place-items:center;overflow:hidden;position:relative;
}
.qp-cover .qp-glyph{position:relative;z-index:1;font-size:14px;font-weight:700;color:rgba(255,255,255,.92)}
.qp-main{flex:1;min-width:0}
.qp-name{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qp-meta{font-size:10.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.qp-acts{display:flex;gap:1px;flex:0 0 auto;opacity:.3;transition:opacity .2s var(--ease)}
.qp-item:hover .qp-acts,.qp-item.now .qp-acts{opacity:1}
.qp-act{
  width:27px;height:27px;border-radius:50%;
  display:grid;place-items:center;
  color:var(--text-3);
  transition:color .2s,background .2s,transform .2s var(--ease);
}
.qp-act:hover{color:var(--brand-1);background:var(--brand-soft)}
.qp-act:active{transform:scale(.88)}
.qp-act:disabled{opacity:.25;cursor:not-allowed}
.qp-act:disabled:hover{color:var(--text-3);background:none}
.qp-act svg{width:14px;height:14px}
.qp-act[data-q="add"]{color:var(--text-2)}
.qp-eq{display:flex;align-items:flex-end;gap:2px;height:13px;width:15px;flex:0 0 auto;padding-right:2px}
.qp-eq i{display:block;width:2.5px;border-radius:2px;background:var(--brand-grad);animation:eqBar .9s var(--ease-io) infinite alternate;transform-origin:bottom}
.qp-eq i:nth-child(1){animation-delay:-.5s}
.qp-eq i:nth-child(2){animation-delay:-.15s}
.qp-eq i:nth-child(3){animation-delay:-.75s}
.qp-eq.paused i{animation-play-state:paused;opacity:.35}
.qp-tag{
  font-size:9px;font-weight:800;letter-spacing:.4px;
  padding:1px 5px;border-radius:5px;
  background:var(--brand-soft);color:var(--brand-1);
  flex:0 0 auto;
}

/* 队列入口角标 */
.icon-btn{position:relative}
.icon-btn.has-badge::after{
  content:attr(data-count);
  position:absolute;top:-1px;right:-3px;
  min-width:15px;height:15px;padding:0 4px;
  border-radius:99px;
  background:var(--brand-1);color:var(--on-brand);
  font-size:9px;font-weight:800;line-height:15px;text-align:center;
  box-shadow:0 0 0 2px var(--bg);
  font-variant-numeric:tabular-nums;
}

/* 歌曲行：加入队列 */
.song-add{
  width:32px;height:32px;border-radius:50%;
  display:grid;place-items:center;
  color:var(--text-3);
  opacity:.32;
  flex:0 0 auto;
  transition:opacity .2s var(--ease),color .2s,background .2s,transform .2s var(--ease);
}
.song-add svg{width:16px;height:16px}
.song:hover .song-add,.song-add:focus-visible{opacity:1}
.song-add:hover{color:var(--brand-1);background:var(--brand-soft)}
.song-add:active{transform:scale(.88)}
.song-add.in-queue{opacity:1;color:var(--brand-1);background:var(--brand-soft)}

/* ============================================================
   移动端音量（全屏播放页内）
   ============================================================ */
.mnp-vol{display:flex;align-items:center;gap:8px;padding:0 0 6px}
.mnp-vol .cbtn{width:34px;height:34px;flex:0 0 auto}
.mnp-vol .cbtn svg{width:17px;height:17px}
.mnp-vol-bar{
  position:relative;flex:1 1 auto;min-width:0;
  height:22px;display:flex;align-items:center;
  cursor:pointer;touch-action:none;
}
.mnp-vol-bar .vol-bg{left:0;right:0}
.mnp-vol-bar .vol-fill{left:0}
.mnp-vol-val{
  font-size:11px;color:var(--text-3);
  min-width:28px;text-align:right;
  font-variant-numeric:tabular-nums;flex:0 0 auto;
}
.mnp-act-acts{display:flex;gap:2px;align-items:center}

/* ============================================================
   程序化封面（按曲目种子生成几何 · 零外部资源）
   ============================================================ */
.cov-art{
  position:absolute;inset:0;z-index:0;
  display:block;pointer-events:none;
}
.cov-art svg{display:block;width:100%;height:100%}
/* 封面底衬：把渐变、暗角、颗粒统一压到艺术层之下 */
.cov-art::after{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(120% 100% at 50% 0%,transparent 42%,rgba(0,0,0,.26) 100%),
    radial-gradient(closest-side at 50% 50%,transparent 40%,rgba(0,0,0,.16) 100%);
}
/* 小尺寸封面：字形压在艺术层之上 */
.mini-glyph{
  position:relative;z-index:1;
  font-size:18px;font-weight:700;
  color:rgba(255,255,255,.92);
  text-shadow:0 1px 7px rgba(0,0,0,.42);
  line-height:1;
}
.song-cover .cov-art::after,
.mini-cover .cov-art::after,
.qp-cover .cov-art::after{background:radial-gradient(closest-side at 50% 50%,transparent 30%,rgba(0,0,0,.22) 100%)}

/* ============================================================
   队列拖动排序
   ============================================================ */
.qp-item{transition:transform .22s var(--ease),background .2s var(--ease),box-shadow .22s var(--ease)}
.qp-grip{
  width:22px;height:30px;flex:0 0 auto;
  display:grid;place-items:center;
  color:var(--text-3);
  cursor:grab;touch-action:none;
  border-radius:7px;
  opacity:.45;
  transition:opacity .2s var(--ease),color .2s var(--ease),background .2s var(--ease);
}
.qp-grip svg{width:13px;height:13px;pointer-events:none}
.qp-item:hover .qp-grip,.qp-grip:focus-visible{opacity:1}
.qp-grip:hover{color:var(--text);background:var(--hover-2)}
.qp-grip:active,.qp-body.dragging .qp-grip{cursor:grabbing}
.qp-body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
.qp-body.dragging .qp-item:not(.dragging):hover{background:none}
.qp-item.dragging{
  z-index:4;
  background:var(--surface);
  box-shadow:0 20px 40px -14px var(--shadow-xl),0 0 0 1px var(--brand-edge);
  cursor:grabbing;
  transition:background .2s var(--ease),box-shadow .2s var(--ease);   /* transform 不加过渡，跟手 */
}
.qp-item.dragging .qp-name{color:var(--text)}
.qp-item.dragging .qp-acts{opacity:1}
/* 已排队的行：给抓手一点存在感，但又不能盖过播放意图 */
.qp-item[data-pos] .qp-grip{opacity:.6}
.qp-item[data-pos]:hover .qp-grip{opacity:1}

/* ============================================================
   导出 WAV
   ============================================================ */
.exp-card{
  position:fixed;z-index:82;
  left:50%;top:calc(16px + env(safe-area-inset-top,0px));
  transform:translate(-50%,-14px);
  width:min(368px,calc(100vw - 28px));
  background:var(--pop-bg);
  border:1px solid var(--line-strong);
  border-radius:18px;
  padding:14px 16px 15px;
  box-shadow:0 26px 60px -18px var(--shadow-xl);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  opacity:0;pointer-events:none;visibility:hidden;
  /* visibility 也要过渡：这样淡出动画照旧，而动画结束的瞬间它就退出焦点序列。
     只写 opacity:0 的话元素仍然能被 Tab 命中 —— 焦点落到一块看不见的东西上。 */
  transition:opacity .26s var(--ease),transform .32s var(--ease),visibility .32s linear;
}
.exp-card.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;visibility:visible}
.exp-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.exp-title{flex:1;min-width:0;font-size:13.5px;font-weight:800;letter-spacing:.2px}
.exp-song{
  font-size:11.5px;color:var(--text-2);
  margin-bottom:10px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.exp-bar{height:5px;border-radius:99px;background:var(--track-bg);overflow:hidden}
.exp-bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--brand-grad);transition:width .28s linear}
.exp-card.busy .exp-bar i{animation:expPulse 1.5s var(--ease-io) infinite}
@keyframes expPulse{0%,100%{opacity:.55}50%{opacity:1}}
.exp-meta{
  display:flex;align-items:baseline;gap:8px;
  margin-top:9px;
  font-size:10.5px;color:var(--text-3);
  font-variant-numeric:tabular-nums;
}
.exp-meta .exp-pct{margin-left:auto;color:var(--brand-1);font-weight:800}
.exp-card.failed .exp-pct{color:var(--like)}
.exp-save{
  display:none;
  margin-top:11px;width:100%;height:37px;border-radius:11px;
  background:var(--brand-grad);color:var(--on-brand);
  font-size:12.5px;font-weight:800;letter-spacing:.3px;
  transition:transform .18s var(--ease),filter .18s var(--ease);
}
.exp-card.done .exp-save{display:block}
.exp-save:hover{filter:brightness(1.07)}
.exp-save:active{transform:scale(.98)}

/* ============================================================
   响应式
   ============================================================ */
@media (max-width:1180px){
  .panel-left{flex-basis:330px;width:330px}
  .np-scroll{padding:0 30px}
  .player-bar{padding:0 30px 16px}
  .cover{width:200px;height:200px}
  .cover-glyph{font-size:74px}
  .np-title{font-size:21px}
  .pb-foot .kbd-hint{display:none}
}

/* 平板 / 手机：单栏 + mini bar + 全屏播放页 */
@media (max-width:900px){
  .panel-right{display:none}
  .mini-bar{display:flex}
  .mobile-np{display:flex}
  .panel-left{
    flex:1 1 auto;width:100%;
    min-width:0;
    border-right:none;
    background:var(--bg);
    overflow:hidden;
  }
  .brand{padding:calc(18px + env(safe-area-inset-top,0px)) 20px 14px;min-width:0}
  .search-zone{padding:0 20px 12px;min-width:0}
  .suggest{left:20px;right:20px}
  .chips{padding:0 20px 12px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;min-width:0;max-width:100%}
  .chips::-webkit-scrollbar{display:none}
  .list-head{padding:6px 20px 8px;gap:10px}
  .list-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .list-count{display:none}
  .mini-btn{white-space:nowrap;flex:0 0 auto}
  .song-scroll{padding:0 10px calc(96px + env(safe-area-inset-bottom,0px));min-width:0}
  .song{padding:8px 10px}
  .song-cover{width:52px;height:52px;border-radius:15px}
  .song-dur{min-width:32px}
  .song-add{display:none}

  /* 队列：底部面板 */
  .queue-panel{
    top:auto;right:0;left:0;bottom:0;
    width:auto;
    max-height:76vh;
    border-left:none;
    border-top:1px solid var(--line-strong);
    border-radius:24px 24px 0 0;
    transform:translateY(103%);
    box-shadow:0 -22px 64px -22px var(--shadow-xl);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .queue-panel.open{transform:none;visibility:visible}
  .qp-head{padding-top:20px}
  .qp-head::before{
    content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);
    width:38px;height:4px;border-radius:99px;background:var(--track-bg);
  }
  .qp-acts{opacity:1}
  .qp-body{padding:4px 10px 16px}
  /* 抓手在触屏上要够大 */
  .qp-grip{width:30px;height:38px;opacity:.72}
  .qp-grip svg{width:15px;height:15px}

  /* 导出卡：贴到底部栏之上。上面那条可能是 mini bar(高 64) 也可能是全屏播放页的
     .mnp-foot(高 ~171)，差一倍多，写死任何一个数值都会压住另一边的控件。
     所以由 bottomChromeClearance() 量出当前实际净空，写进 --exp-bottom。 */
  .exp-card{
    top:auto;
    bottom:var(--exp-bottom, calc(84px + env(safe-area-inset-bottom,0px)));
    transform:translate(-50%,14px);
  }
  .exp-card.show{transform:translate(-50%,0)}
}

@media (max-width:400px){
  .song-cover{width:48px;height:48px}
  .cover{width:200px;height:200px}
  .cover-glyph{font-size:74px}
  .np-title{font-size:21px}
  .lrc-line{font-size:16px}
  .lrc-line.cur{font-size:19px}
  .brand-acts{gap:4px}
  .theme-btn{width:34px;height:34px}
  .mnp-vol-val{display:none}
}

/* 短屏（横屏手机） */
@media (max-height:620px) and (max-width:900px){
  .mnp-vol{padding-bottom:2px}
  .mnp-vol-bar{height:18px}
}
@media (max-height:600px) and (max-width:900px){
  .mnp-body .cover-wrap{margin:8px 0 12px}
  .cover{width:150px !important;height:150px !important}
  .cover-glyph{font-size:52px !important}
  .lyric-zone{min-height:110px !important}
}

/* ---------- 无障碍 ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
    scroll-behavior:auto !important;
  }
  .eq i{height:9px}
  /* 关闭随节奏的律动，保持静态 */
  .cover-halo{opacity:.3;transform:none}
  .playing .cover{transform:scale(1.012)}
  .track-fill{box-shadow:none}
  .play-btn{box-shadow:0 10px 30px -8px var(--brand-glow)}
  .queue-panel,.scrim{transition:none}
  /* 拖动排序：去掉位移动画，改为即时贴位，并让被拖行有个明显边框 */
  .qp-item{transition:none}
  .qp-item.dragging{box-shadow:0 0 0 2px var(--brand-edge)}
  .exp-card{transition:none}
  .exp-bar i{transition:none;animation:none}
}

.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
:focus-visible{outline:2px solid var(--brand-1);outline-offset:2px;border-radius:6px}

/* 浮动提示 */
.toast{
  position:fixed;
  left:50%;
  bottom:190px;
  transform:translateX(-50%) translateY(14px);
  background:var(--toast-bg);
  color:var(--text);
  font-size:12.5px;
  padding:9px 16px;
  border-radius:99px;
  border:1px solid var(--line-strong);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  z-index:200;
  opacity:0;
  transition:opacity .24s var(--ease),transform .24s var(--ease);
  pointer-events:none;
  white-space:nowrap;
  max-width:88vw;
  overflow:hidden;
  text-overflow:ellipsis;
  box-shadow:0 12px 32px -10px var(--shadow-lg);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
[data-theme="light"] .toast{color:#F6F3EA}

@media (max-width:900px){
  /* --toast-bottom 由 bottomChromeClearance() 在每次 toast() 时写入。
     兜底值给的是「mini bar 之上」，万一 JS 没跑也不会压住底栏。 */
  .toast{bottom:var(--toast-bottom, calc(88px + env(safe-area-inset-bottom,0px)));font-size:12px}
}
</style>

<body>
<div class="app">
  <!-- ============ 左栏 ============ -->
  <aside class="panel-left">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M9 18V6.6c0-.5.33-.93.81-1.06l7.5-2.1c.72-.2 1.44.34 1.44 1.09V15" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="6.5" cy="18" r="2.6" fill="#FFFFFF"/>
          <circle cx="17.2" cy="15" r="2.6" fill="#FFFFFF"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">可乐音乐</div>
        <div class="brand-sub">Personal Player</div>
      </div>
      <div class="brand-acts">
        <button class="theme-btn" id="btnTheme" aria-label="切换浅色主题" title="切换主题">
          <svg class="t-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/>
          </svg>
          <svg class="t-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.9"/>
            <path d="M12 2.6v2.2M12 19.2v2.2M4.2 12H2M22 12h-2.2M5.6 5.6L4 4M20 20l-1.6-1.6M18.4 5.6L20 4M4 20l1.6-1.6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="search-zone">
      <div class="search-box" id="searchBox">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="M20 20l-3.6-3.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="searchInput" type="search" placeholder="搜索歌曲、歌手或歌词" autocomplete="off" spellcheck="false" aria-label="搜索歌曲">
        <button class="search-clear" id="searchClear" aria-label="清空搜索">
          <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="suggest" id="suggest" role="listbox" aria-label="搜索建议"></div>
    </div>

    <div class="chips" id="chips" role="group" aria-label="热门搜索"></div>

    <div class="list-head">
      <div class="list-title" id="listTitle">我的歌单</div>
      <div class="list-tools">
        <span class="list-count" id="listCount"></span>
        <button class="mini-btn" id="shuffleAll">随机播放</button>
      </div>
    </div>

    <div class="song-scroll" id="songScroll">
      <ul class="song-list" id="songList" role="list"></ul>
      <div class="empty" id="emptyState" hidden>
        <div class="empty-badge">🔍</div>
        <h4>没找到相关歌曲</h4>
        <p>换个关键词试试，或者点「清空」回到完整歌单</p>
      </div>
    </div>
  </aside>

  <!-- ============ 右栏：正在播放 ============ -->
  <section class="panel-right" id="panelRight">
    <div class="np-scroll" id="npScroll">
      <div class="np-top">
        <div class="np-label">
          <span class="pulse" id="pulse"></span>
          <span id="playState">已暂停</span>
        </div>
        <div class="np-top-acts">
          <button class="icon-btn" id="btnQueueTop" title="播放队列" aria-label="播放队列">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h11M4 12h11M4 17h7" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M18.6 13.4v6.2M15.5 16.5h6.2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
          </button>
          <button class="icon-btn" id="btnFavTop" title="收藏" aria-label="收藏当前歌曲">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 20.5S3.8 15.4 3.8 9.6A4.6 4.6 0 0 1 12 6.7a4.6 4.6 0 0 1 8.2 2.9c0 5.8-8.2 10.9-8.2 10.9z" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-btn" id="btnShare" title="复制歌曲信息" aria-label="复制歌曲信息">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 15V4m0 0L8.4 7.6M12 4l3.6 3.6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 14v4.4c0 .9.7 1.6 1.6 1.6h10.8c.9 0 1.6-.7 1.6-1.6V14" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
          </button>
          <button class="icon-btn" id="btnExport" title="导出为 WAV" aria-label="导出当前歌曲为 WAV 音频">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 4v11m0 0l-3.6-3.6M12 15l3.6-3.6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 14v4.4c0 .9.7 1.6 1.6 1.6h10.8c.9 0 1.6-.7 1.6-1.6V14" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>

      <div class="cover-wrap">
        <div class="cover-halo" id="coverHalo"></div>

          <span class="cov-art" id="coverArt"></span>
          <span class="cover-glyph" id="coverGlyph">♪</span>
          <span class="cover-idx" id="coverIdx">01 / 08</span>
        </div>
      </div>

      <div class="np-info">
        <div class="np-text">
          <div class="np-title" id="npTitle">—</div>
          <div class="np-artist" id="npArtist">—</div>
        </div>
        <button class="np-like" id="btnFav" aria-label="收藏当前歌曲">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 20.5S3.8 15.4 3.8 9.6A4.6 4.6 0 0 1 12 6.7a4.6 4.6 0 0 1 8.2 2.9c0 5.8-8.2 10.9-8.2 10.9z" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="lyric-zone" id="lyricZone">
        <div class="lyric-track" id="lyricTrack"></div>
      </div>
    </div>

    <div class="player-bar">
      <div class="pb-inner">

          <div class="track" id="track" role="slider" tabindex="0" aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="track-bg">
              <div class="track-buf" id="trackBuf"></div>
              <div class="track-fill" id="trackFill"></div>
            </div>
            <div class="track-knob" id="trackKnob"></div>
          </div>
          <span class="time r" id="timeTotal">0:00</span>
        </div>

        <div class="ctrl-row">
          <div class="ctrl-group">
            <button class="cbtn" id="btnLoop" title="循环模式" aria-label="切换循环模式">
              <svg viewBox="0 0 24 24" fill="none"><path d="M4 12V9.5A3.5 3.5 0 0 1 7.5 6H17" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M14.6 3.4L17.4 6l-2.8 2.6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 12v2.5A3.5 3.5 0 0 1 16.5 18H7" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M9.4 20.6L6.6 18l2.8-2.6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="cbtn" id="btnPrev" title="上一首" aria-label="上一首">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 6a1 1 0 0 1 2 0v12a1 1 0 1 1-2 0V6z"/><path d="M18.5 6.6v10.8c0 .8-.9 1.3-1.6.9l-8.1-5.4a1.1 1.1 0 0 1 0-1.8l8.1-5.4c.7-.4 1.6.1 1.6.9z"/></svg>
            </button>
          </div>

          <button class="play-btn" id="btnPlay" aria-label="播放">
            <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.6v12.8c0 .9 1 1.5 1.8 1l10-6.4a1.2 1.2 0 0 0 0-2L9.8 4.6c-.8-.5-1.8.1-1.8 1z"/></svg>
            <svg id="iconPause" viewBox="0 0 24 24" fill="currentColor" hidden><rect x="6.6" y="5" width="4" height="14" rx="1.6"/><rect x="13.4" y="5" width="4" height="14" rx="1.6"/></svg>
          </button>

          <div class="ctrl-group">
            <button class="cbtn" id="btnNext" title="下一首" aria-label="下一首">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 6a1 1 0 0 0-2 0v12a1 1 0 1 0 2 0V6z"/><path d="M5.5 6.6v10.8c0 .8.9 1.3 1.6.9l8.1-5.4a1.1 1.1 0 0 0 0-1.8L7.1 5.7c-.7-.4-1.6.1-1.6.9z"/></svg>
            </button>
            <button class="cbtn" id="btnShuffle" title="随机播放" aria-label="随机播放">
              <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h3.2c1 0 2 .5 2.6 1.3l4.4 6.4c.6.8 1.6 1.3 2.6 1.3H20" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M17.4 3.4L20.4 6l-3 2.6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 17h3.2c1 0 2-.5 2.6-1.3l1.1-1.6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M14.2 9.2l.9-1.3C15.7 7.1 16.6 6.6 17.6 6.6H20" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M17.4 15.4l3 2.6-3 2.6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>

function noteToMidi(name){
  const m = /^([A-Ga-g])([#b]?)(-?\d)$/.exec(name);
  if(!m) return null;
  let v = NOTE_MAP[m[1].toUpperCase()];
  if(m[2] === '#') v += 1;
  if(m[2] === 'b') v -= 1;
  return v + (parseInt(m[3], 10) + 1) * 12;

  return type.map(i => root + i);

/* ============================================================
   2.1 程序化封面
   每首歌按索引确定性生成一套几何：同一首每次渲染完全一致，
   不同曲目走不同母题，8 首互不重样。纯内联 SVG，零外部资源。
   ============================================================ */

/* 确定性伪随机（LCG）：种子相同 -> 序列相同 */
function seedRnd(seed){
  let s = (seed * 9301 + 49297) % 233280;
  return function(){
    s = (s * 9301 + 49297) % 233280;
    return s / 233280;
  };
}
const wA = (a) => 'rgba(255,255,255,' + a + ')';
const kA = (a) => 'rgba(0,0,0,' + a + ')';

/* 软斑层：给封面制造纵深，永远压在几何之下 */
function artBlobs(rnd){
  const spots = [[22,20,36],[92,28,28],[34,96,32],[96,86,24]];
  let o = '';
  spots.forEach(p => {
    o += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + p[2] + '" fill="' + wA((.045 + rnd() * .06).toFixed(3)) + '"/>';
  });
  o += '<circle cx="64" cy="52" r="30" fill="' + wA('.045') + '"/>';
  return o;
}

/* 中心承台：让字形/编号始终落在一块安静的暗底上，与母题无关 */
function artPlate(){
  let o = '';
  for(let i = 0; i < 7; i++){
    const r = 12 + i * 6;
    o += '<ellipse cx="60" cy="60" rx="' + r + '" ry="' + (r * .95).toFixed(1) + '" fill="' + kA('.045') + '"/>';
  }
  return o;
}

/* ---- 母题 1：同心弧 ---- */
function motifArcs(rnd){
  let o = '<g fill="none">';
  for(let i = 0; i < 6; i++){
    o += '<circle cx="106" cy="108" r="' + (30 + i * 14) + '" stroke="' + wA((.20 - i * .026).toFixed(3)) +
         '" stroke-width="' + (2.6 - i * .28).toFixed(2) + '"/>';
  }
  o += '</g>';
  o += '<circle cx="30" cy="30" r="17" fill="' + wA('.20') + '"/>';
  o += '<circle cx="30" cy="30" r="9" fill="' + wA('.18') + '"/>';
  o += '<circle cx="54" cy="50" r="3.4" fill="' + wA('.5') + '"/>';
  return o;
}

/* ---- 母题 2：透视网格 ---- */
function motifGrid(rnd){
  const vx = 60, vy = 30, bottom = 128;
  let o = '';
  for(let i = -6; i <= 6; i++){
    const strong = i % 2 === 0;
    o += '<line x1="' + vx + '" y1="' + vy + '" x2="' + (60 + i * 26) + '" y2="' + bottom + '" stroke="' +
         wA(strong ? .20 : .09) + '" stroke-width="' + (strong ? 1.5 : .8) + '"/>';
  }
  /* 横向格线：透视下越远越密。用等比数列直接算位置，
     不要用「每次乘衰减再累减」——等比衰减的累加和有极限，永远够不到地平线。 */
  for(let i = 0; i <= 8; i++){
    const y = vy + (bottom - vy) * Math.pow(.72, i);
    o += '<line x1="-6" y1="' + y.toFixed(1) + '" x2="126" y2="' + y.toFixed(1) + '" stroke="' + wA('.15') + '" stroke-width="1"/>';
  }
  o += '<circle cx="' + vx + '" cy="' + vy + '" r="26" fill="' + wA('.14') + '"/>';
  o += '<circle cx="' + vx + '" cy="' + vy + '" r="4.5" fill="' + wA('.55') + '"/>';
  return o;
}

/* ---- 母题 3：声波 ---- */
function waveD(y, amp, periods, phase){
  let d = 'M0 ' + y.toFixed(1);
  const N = 20;
  for(let i = 1; i <= N; i++){
    const yy = y + Math.sin((i / N) * periods * Math.PI * 2 + phase) * amp;
    d += ' L' + (i * (120 / N)).toFixed(1) + ' ' + yy.toFixed(1);
  }
  return d;
}
function motifWaves(rnd){
  let o = '<g fill="none">';
  for(let i = 0; i < 7; i++){
    o += '<path d="' + waveD(16 + i * 15, 9 + rnd() * 7, 1.2 + rnd() * .9, i * .7) +
         '" stroke="' + wA((.10 + i * .022).toFixed(3)) + '" stroke-width="' + (1.1 + (i % 3) * .5).toFixed(1) + '"/>';
  }
  return o + '</g>';
}

/* ---- 母题 4：放射 ---- */
function motifRays(rnd){
  const cx = 16, cy = 104;
  let o = '';
  for(let i = 0; i < 16; i++){
    const a = -Math.PI / 2 + (i / 15) * Math.PI;
    const strong = i % 4 === 0;
    o += '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + Math.cos(a) * 152).toFixed(1) +
         '" y2="' + (cy + Math.sin(a) * 152).toFixed(1) + '" stroke="' + wA(strong ? .22 : .11) +
         '" stroke-width="' + (strong ? 2.2 : 1) + '"/>';
  }
  o += '<circle cx="' + cx + '" cy="' + cy + '" r="30" fill="' + wA('.18') + '"/>';
  return o;
}

/* ---- 母题 5：光斑 ---- */
function motifBokeh(rnd){
  let o = '<g>';
  for(let i = 0; i < 20; i++){
    const r = 3 + rnd() * (i % 5 === 0 ? 22 : 10);
    o += '<circle cx="' + (rnd() * 120).toFixed(1) + '" cy="' + (rnd() * 120).toFixed(1) +
         '" r="' + r.toFixed(1) + '" fill="' + wA((.035 + rnd() * .09).toFixed(3)) + '"/>';
  }
  return o + '</g>';
}

/* ---- 母题 6：棱镜 ---- */
function motifPrism(rnd){
  const tri = (y1, sp, fill, stroke) =>
    '<polygon points="60,' + y1 + ' ' + (60 + sp) + ',92 ' + (60 - sp) + ',92" fill="' + fill + '"' +
    (stroke ? ' stroke="' + stroke + '" stroke-width="1.4"' : '') + '/>';
  let o = '';
  o += tri(14, 48, wA('.10'), '');
  o += tri(34, 36, 'none', wA('.26'));
  o += tri(54, 24, wA('.16'), '');
  o += tri(74, 14, 'none', wA('.30'));
  o += '<circle cx="60" cy="34" r="3.6" fill="' + wA('.6') + '"/>';
  return o;
}

/* ---- 母题 7：轨道 ---- */
function motifOrbit(rnd){
  let o = '<g fill="none" stroke="' + wA('.18') + '" stroke-width="1.3">';
  for(let i = 0; i < 3; i++){
    o += '<ellipse cx="60" cy="60" rx="' + (48 - i * 9) + '" ry="' + (20 - i * 3) +
         '" transform="rotate(' + (-28 + i * 28) + ' 60 60)"/>';
  }
  o += '</g>';
  o += '<circle cx="60" cy="60" r="9" fill="' + wA('.24') + '"/>';
  o += '<circle cx="104" cy="42" r="4.6" fill="' + wA('.62') + '"/>';
  o += '<circle cx="22" cy="78" r="3" fill="' + wA('.42') + '"/>';
  return o;
}

/* ---- 母题 8：织带 ---- */
function motifRibbon(rnd){
  const band = (y0, wdt, a) => {
    const d = 'M-8 ' + y0 +
      ' C 26 ' + (y0 - 22) + ', 62 ' + (y0 + 26) + ', 128 ' + (y0 - 8) +
      ' L 128 ' + (y0 - 8 + wdt) +
      ' C 62 ' + (y0 + 26 + wdt) + ', 26 ' + (y0 - 22 + wdt) + ', -8 ' + (y0 + wdt) + ' Z';
    return '<path d="' + d + '" fill="' + wA(a) + '"/>';
  };
  return band(18, 13, .09) + band(44, 10, .13) + band(66, 16, .08) + band(90, 12, .11);
}

const MOTIFS = [motifArcs, motifGrid, motifWaves, motifRays, motifBokeh, motifPrism, motifOrbit, motifRibbon];

/* 组装：软斑 + 母题 + 中心承台。缓存，避免每次渲染重算 */
const artCache = {};
function coverArtSVG(i){
  if(artCache[i]) return artCache[i];
  const rnd = seedRnd(i * 7919 + 13);
  artCache[i] =
    '<svg viewBox="0 0 120 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">' +
      artBlobs(rnd) + MOTIFS[i % MOTIFS.length](rnd) + artPlate() +
    '</svg>';
  return artCache[i];
}
const artHolder = (i, cls) => '<span class="cov-art' + (cls ? ' ' + cls : '') + '">' + coverArtSVG(i) + '</span>';
/* ============================================================
   3. 音频引擎（Web Audio 实时合成）
   ============================================================ */
const SEG = [0, 0, 1, 0];        // 段落编排：A A B A
const SEG_TICKS = 64;            // 每段 64 个 16 分音符（= 4 小节）
const LOOP_TICKS = SEG_TICKS * SEG.length;

/* 噪声源（军鼓 / 踩镲）用固定种子生成。
   用 Math.random() 的话，实时听到的噪声和离线导出的不是同一份，
   A/B 对比会差出一大截，导出也不可复现。xorshift32 足够快且完全确定。 */
const NOISE_SEED = 0x9E3779B9;
function makeNoiseBuffer(ctx, seed){
  const len = Math.floor(ctx.sampleRate * .6);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  let s = (seed >>> 0) || NOISE_SEED;
  for(let i = 0; i < len; i++){
    s ^= s << 13; s >>>= 0;
    s ^= s >>> 17;
    s ^= s << 5;  s >>>= 0;
    d[i] = s / 2147483648 - 1;      /* [0, 2) -> [-1, 1) */
  }
  return buf;
}

const Engine = {
  ctx:null, bus:null, master:null, comp:null, delay:null, fb:null, delayWet:null,
  noiseBuf:null,
  playing:false, idx:0, pos:0, startCtx:0, schedTick:0, timer:null,
  vol:.7, muted:false,

  init(){
    if(this.ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC){ toast('当前浏览器不支持 Web Audio API'); return false; }
    try{
      this.ctx = new AC();
    }catch(err){
      toast('音频引擎初始化失败，请检查浏览器音频权限');
      return false;
    }
    const ctx = this.ctx;

    this.master = ctx.createGain();
    this.master.gain.value = this.muted ? 0 : this.vol;

    this.comp = ctx.createDynamicsCompressor();
    this.comp.threshold.value = -13;
    this.comp.knee.value = 26;
    this.comp.ratio.value = 6;
    this.comp.attack.value = .004;
    this.comp.release.value = .22;

    this.bus = ctx.createGain();
    this.bus.gain.value = 0;

    /* 空间感延迟 */
    this.delay = ctx.createDelay(1);
    this.delay.delayTime.value = .27;
    this.fb = ctx.createGain(); this.fb.gain.value = .26;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400; lp.Q.value = .6;
    this.delayWet = ctx.createGain(); this.delayWet.gain.value = .2;
    this.delay.connect(lp); lp.connect(this.fb); this.fb.connect(this.delay);
    this.delay.connect(this.delayWet); this.delayWet.connect(this.bus);

    this.bus.connect(this.comp);
    this.comp.connect(this.master);
    this.master.connect(ctx.destination);

    /* 频谱分析：驱动界面律动 */
    this.analyser = ctx.createAnalyser();
    this.analyser.fftSize = 128;
    this.analyser.smoothingTimeConstant = .76;
    this.comp.connect(this.analyser);
    this.freqData = new Uint8Array(this.analyser.frequencyBinCount);

    /* 噪声源（军鼓 / 踩镲） */
    this.noiseBuf = makeNoiseBuffer(ctx, NOISE_SEED);

    return true;
  },

  song(){ return SONGS[this.idx]; },
  tickDur(){ return 60 / this.song().bpm / 4; },   // 16 分音符时长

  /* ---------- 音色发声 ---------- */
  tone(freq, when, dur, p, send){
    const ctx = this.ctx;
    const o = ctx.createOscillator();
    o.type = p.wave;
    o.frequency.value = freq;
    if(p.detune) o.detune.value = p.detune;
    const g = ctx.createGain();
    const peak = p.gain;
    const atk = p.atk;
    const dec = p.dec || .1;
    const sus = p.sus != null ? p.sus : .7;
    const rel = p.rel;

    const t0 = when, t1 = when + atk;
    g.gain.setValueAtTime(.0001, t0);
    g.gain.linearRampToValueAtTime(peak, t1);
    g.gain.exponentialRampToValueAtTime(Math.max(peak * sus, .0001), t1 + dec);
    const endT = Math.max(t1 + dec, when + dur);
    g.gain.setValueAtTime(Math.max(peak * sus, .0001), endT);
    g.gain.exponentialRampToValueAtTime(.0001, endT + rel);

    o.connect(g);
    g.connect(this.bus);
    if(send){
      const s = ctx.createGain(); s.gain.value = send;
      g.connect(s); s.connect(this.delay);
    }
    o.start(t0);
    o.stop(endT + rel + .03);
  },

  padTone(freq, when, dur, p){
    const ctx = this.ctx;
    const o = ctx.createOscillator();
    o.type = p.wave;
    o.frequency.value = freq;
    o.detune.value = 5;
    const g = ctx.createGain();
    g.gain.setValueAtTime(.0001, when);
    g.gain.linearRampToValueAtTime(p.gain, when + p.atk);
    g.gain.setValueAtTime(p.gain, when + dur);
    g.gain.exponentialRampToValueAtTime(.0001, when + dur + p.rel);
    o.connect(g); g.connect(this.bus);
    o.start(when); o.stop(when + dur + p.rel + .05);
  },

  kick(when, gain){
    const ctx = this.ctx;
    const o = ctx.createOscillator();
    o.type = 'sine';
    const g = ctx.createGain();
    o.frequency.setValueAtTime(150, when);
    o.frequency.exponentialRampToValueAtTime(44, when + .11);
    g.gain.setValueAtTime(gain, when);
    g.gain.exponentialRampToValueAtTime(.0001, when + .3);
    o.connect(g); g.connect(this.bus);
    o.start(when); o.stop(when + .34);
  },

  snare(when, gain){
    const ctx = this.ctx;
    const src = ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 1900; bp.Q.value = .8;
    const g = ctx.createGain();
    g.gain.setValueAtTime(gain, when);
    g.gain.exponentialRampToValueAtTime(.0001, when + .17);
    src.connect(bp); bp.connect(g); g.connect(this.bus);
    src.start(when); src.stop(when + .2);
  },

  hat(when, gain, open){
    const ctx = this.ctx;
    const src = ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 8200;
    const g = ctx.createGain();
    const d = open ? .17 : .038;
    g.gain.setValueAtTime(gain, when);
    g.gain.exponentialRampToValueAtTime(.0001, when + d);
    src.connect(hp); hp.connect(g); g.connect(this.bus);
    src.start(when); src.stop(when + d + .02);
  },

  /* ---------- 调度 ---------- */
  scheduleTick(absTick, when){
    const s = this.song();
    const P = PATCHES[s.patch];
    const td = this.tickDur();
    const barTick = absTick % LOOP_TICKS;
    const segType = SEG[Math.floor(barTick / SEG_TICKS)];
    const localTick = barTick % SEG_TICKS;
    const stepInBar = localTick % 16;

    /* 旋律 */
    if(localTick % 2 === 0){
      const melIdx = localTick / 2;
      const map = segType === 1 ? s.melBMap : s.melAMap;
      const midi = map.get(melIdx);
      if(midi != null){
        this.tone(midiToFreq(midi + (P.lead.oct * 12)), when, td * 1.8, P.lead, .42);
      }
    }

    /* 和弦铺底 + 贝斯 */
    if(stepInBar === 0){
      const chord = s.chordArr[Math.floor(localTick / 16)];
      chord.forEach((m, i) => this.padTone(midiToFreq(m), when, td * 15, P.pad));
      const root = chord[0] + P.bass.oct * 12;
      this.tone(midiToFreq(root), when, td * 6.5, P.bass, 0);
    }
    if(stepInBar === 6 || stepInBar === 10){
      const chord = s.chordArr[Math.floor(localTick / 16)];
      const alt = chord[0] + 7 + P.bass.oct * 12;
      this.tone(midiToFreq(stepInBar === 6 ? chord[0] + P.bass.oct * 12 : alt), when, td * 2.6, P.bass, 0);
    }

    /* 鼓组 */
    const D = s.drum;
    if(D.k.indexOf(stepInBar) > -1) this.kick(when, P.drums.kick);
    if(D.s.indexOf(stepInBar) > -1) this.snare(when, P.drums.snare);
    if(D.h.indexOf(stepInBar) > -1) this.hat(when, P.drums.hat, stepInBar % 8 === 6);
  },

  loop(){
    if(!this.playing) return;
    const ctx = this.ctx;
    const td = this.tickDur();
    const elapsed = ctx.currentTime - this.startCtx;
    const horizon = elapsed + .12;
    let guard = 0;
    while(this.schedTick * td < horizon && guard++ < 400){
      const when = this.startCtx + this.schedTick * td;
      if(ctx.currentTime - when < td * 1.6){
        this.scheduleTick(this.schedTick, Math.max(when, ctx.currentTime + .006));
      }
      this.schedTick++;
    }
    /* 曲终 */
    if(elapsed >= this.song().dur){
      this.onEnd && this.onEnd();
    }
  },

  /* ---------- 对外控制 ---------- */
  fadeBus(to, sec){
    if(!this.ctx) return;
    const g = this.bus.gain, t = this.ctx.currentTime;
    g.cancelScheduledValues(t);
    g.setValueAtTime(Math.max(g.value, .0001), t);
    g.linearRampToValueAtTime(Math.max(to, .0001), t + sec);
  },

  load(idx, autoplay){
    this.stopScheduler();
    if(this.ctx) this.fadeBus(0, .04);
    this.idx = idx;
    this.pos = 0;
    this.schedTick = 0;
    /* 未初始化时只切换曲目，等用户手势后再建立 AudioContext */
    if(autoplay){ if(this.init()) this.start(0); }
  },

  start(fromPos){
    if(!this.init()) return;
    this.ctx.resume();
    this.pos = fromPos != null ? fromPos : this.pos;
    const td = this.tickDur();
    this.schedTick = Math.floor(this.pos / td);
    this.startCtx = this.ctx.currentTime - this.pos;
    this.playing = true;
    this.fadeBus(1, .05);
    this.loop();
    if(!this.timer) this.timer = setInterval(() => this.loop(), 25);
  },

  pause(){
    if(!this.playing) return;
    this.playing = false;
    this.pos = clamp(this.ctx.currentTime - this.startCtx, 0, this.song().dur);
    this.fadeBus(0, .05);
    this.stopScheduler();
  },

  stopScheduler(){
    if(this.timer){ clearInterval(this.timer); this.timer = null; }
  },

  seek(pos){
    if(!this.ctx) return;
    pos = clamp(pos, 0, this.song().dur);
    if(this.playing){
      this.fadeBus(0, .03);
      this.pos = pos;
      const td = this.tickDur();
      this.schedTick = Math.floor(pos / td);
      this.startCtx = this.ctx.currentTime - pos;
      setTimeout(() => { if(this.playing) this.fadeBus(1, .05); }, 60);
    } else {
      this.pos = pos;
    }
  },

  toggle(){
    if(!this.init()) return false;
    if(this.playing) this.pause();
    else this.start(this.pos >= this.song().dur - .3 ? 0 : this.pos);
    return this.playing;
  },

  setVol(v){
    this.vol = clamp(v, 0, 1);
    if(this.master && !this.muted){
      const t = this.ctx.currentTime;
      this.master.gain.cancelScheduledValues(t);
      this.master.gain.setTargetAtTime(this.vol, t, .02);
    }
  },

  setMuted(m){
    this.muted = m;
    if(!this.ctx) return;
    const t = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(t);
    this.master.gain.setTargetAtTime(m ? 0 : this.vol, t, .02);
  },

  current(){ return this.playing ? clamp(this.ctx.currentTime - this.startCtx, 0, this.song().dur) : this.pos; }
};
/* ============================================================
   4. 应用状态与工具
   ============================================================ */
const LS_KEY = 'cola.player.v1';
const LS_KEY_LEGACY = 'soda.player.v1';
const THEME_KEY = 'cola.theme.v1';

const App = {
  idx:0, query:'', tag:null,
  onlyFav:false,         // 只看「我喜欢」
  loop:'list',           // list | one
  shuffle:false,
  favs:new Set(),
  lyrics:[], lyricIdx:-2, lyricIdxM:-2,
  dragging:false,
  vol:.7, muted:false,
  volM:.85,              // 移动端独立音量
  queue:[],              // 播放队列（手动加入的歌曲索引）
  qpOpen:false,
  theme:'dark',
  beat:0
};

function hexToRgba(hex, a){
  const h = String(hex).replace('#', '');
  const full = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
  const n = parseInt(full, 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
const escapeHtml = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtTime(sec){
  sec = Math.max(0, Math.floor(sec || 0));
  return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
}
function hl(text, q){
  const safe = escapeHtml(text);
  if(!q) return safe;
  const i = safe.toLowerCase().indexOf(q.toLowerCase());
  if(i < 0) return safe;
  return safe.slice(0, i) + '<mark>' + safe.slice(i, i + q.length) + '</mark>' + safe.slice(i + q.length);
}

/* ---------- 音量：桌面与移动端各存一份 ---------- */
const isMobile = () => window.matchMedia('(max-width:900px)').matches;

/* 当前视口生效的音量：手机上用 volM，桌面上用 vol */
function activeVol(){ return isMobile() ? App.volM : App.vol; }

/* 把 App 的音量状态推给引擎（顺序不能颠倒：先设值再设静音） */
function applyVol(){
  Engine.setVol(activeVol());
  Engine.setMuted(App.muted);
}

/* 调整当前生效的那一路音量 */
function nudgeVol(delta){
  if(isMobile()) App.volM = clamp(App.volM + delta, 0, 1);
  else App.vol = clamp(App.vol + delta, 0, 1);
  App.muted = false;
  applyVol(); syncVolUI(); save();
}

function toggleMute(){
  App.muted = !App.muted;
  applyVol(); syncVolUI(); save();
}

let toastEl = null, toastTimer = null;
function toast(msg){
  if(!toastEl){
    toastEl = document.createElement('div');
    toastEl.className = 'toast';
    document.body.appendChild(toastEl);
  }
  toastEl.textContent = msg;
  /* 同一条让位规则：提示条也不能压住底部控件 —— 尤其它的文案常是
     「点击播放按钮开始」，却正好盖在那个按钮上。 */
  const off = toastBottomOffset();
  if(off != null) toastEl.style.setProperty('--toast-bottom', off + 'px');
  requestAnimationFrame(() => toastEl.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1900);
}

const save = () => {
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      favs:Array.from(App.favs), vol:App.vol, volM:App.volM, muted:App.muted,
      loop:App.loop, shuffle:App.shuffle, idx:App.idx, queue:App.queue
    }));
  }catch(e){ /* 隐私模式忽略 */ }
};
function restore(){
  try{
    let raw = localStorage.getItem(LS_KEY);
    if(!raw){
      /* 从旧版「汽水」数据迁移一次 */
      const legacy = localStorage.getItem(LS_KEY_LEGACY);
      if(legacy){ raw = legacy; try{ localStorage.setItem(LS_KEY, legacy); }catch(e){} }
    }
    if(!raw) return;
    const d = JSON.parse(raw);
    if(Array.isArray(d.favs)) App.favs = new Set(d.favs);
    if(typeof d.vol === 'number') App.vol = clamp(d.vol, 0, 1);
    if(typeof d.volM === 'number') App.volM = clamp(d.volM, 0, 1);
    App.muted = !!d.muted;
    if(d.loop === 'one' || d.loop === 'list') App.loop = d.loop;
    App.shuffle = !!d.shuffle;
    if(typeof d.idx === 'number') App.idx = clamp(d.idx, 0, SONGS.length - 1);
    if(Array.isArray(d.queue)){
      const seen = new Set();
      App.queue = d.queue
        .filter(i => typeof i === 'number' && i >= 0 && i < SONGS.length)
        .filter(i => (seen.has(i) ? false : (seen.add(i), true)));
    }
  }catch(e){ /* 忽略 */ }
}

function applyTheme(name, silent){
  App.theme = name === 'light' ? 'light' : 'dark';
  const root = document.documentElement;
  if(App.theme === 'light') root.setAttribute('data-theme', 'light');
  else root.removeAttribute('data-theme');

  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', App.theme === 'light' ? '#FBF8F2' : '#08080B');

  const btn = $('btnTheme');
  if(btn){
    const label = App.theme === 'light' ? '切换到深色主题' : '切换到浅色主题';
    btn.setAttribute('aria-label', label);
    btn.title = label;
    btn.setAttribute('aria-pressed', App.theme === 'light');
  }
  try{ localStorage.setItem(THEME_KEY, App.theme); }catch(e){}

  if(!silent) toast(App.theme === 'light' ? '浅色主题 · 琥珀 + 墨绿' : '深色主题 · 可乐红金');
}

function initTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur === 'light' ? 'light' : 'dark', true);
}

function toggleTheme(){
  applyTheme(App.theme === 'light' ? 'dark' : 'light');
  setTimeout(recenterLyrics, 60);
}
